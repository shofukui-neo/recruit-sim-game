<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0b3d2e" />
<meta name="format-detection" content="telephone=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>採用面談シミュレーション</title>
<style>
:root{
  --green:#06C755; --navy:#0b3d2e; --ink:#1f2a30; --sub:#6b7b83;
  --line:#e6ebee; --bg:#eef1f3; --card:#ffffff;
  --red:#E5484D; --amber:#F5A623; --orange:#F57C00; --lime:#7CB342;
  --paper:#faf8f3;
  /* 画面の実表示高さ。モバイルはアドレスバーとソフトキーボードで刻々と変わるので、
     JSが visualViewport の高さをここに流し込む。未対応環境は dvh → vh にフォールバック。 */
  --app-h:100vh;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
@supports (height:100dvh){ :root{--app-h:100dvh} }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;}
/* 面談画面はページ自体のスクロールを止める。これが無いとiOSでキーボードが出た瞬間に
   ページごと押し上げられ、入力欄やヘッダーが画面外へ消える。 */
body.playing{position:fixed;inset:0;width:100%;overflow:hidden}
body.noscroll{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
textarea,input{font-family:inherit}
/* iOSは16px未満の入力欄にフォーカスすると自動でズームインしてしまう。16pxが下限。 */
textarea,input,select{font-size:16px}
#app{min-height:var(--app-h)}

@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(6,199,85,.35)}100%{box-shadow:0 0 0 18px rgba(6,199,85,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(104vh) rotate(680deg);opacity:.85}}
@keyframes titleIn{0%{transform:scale(2.3);opacity:0;filter:blur(10px)}60%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes lineSweep{from{width:0}to{width:120px}}
@keyframes urgent{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.screen{animation:fadeIn .35s ease}
.press{transition:transform .12s ease}
.press:active{transform:scale(.95)}
.lift{transition:transform .2s,box-shadow .2s}
/* タッチ端末では :hover が「タップ後も残る」ため、マウス環境だけに限定する */
@media (hover:hover) and (pointer:fine){
  .lift:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.10)}
}

.wrap{max-width:760px;margin:0 auto;
  padding:20px calc(16px + var(--sar)) calc(20px + var(--sab)) calc(16px + var(--sal))}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
.btn-primary{display:block;width:100%;padding:16px;border-radius:16px;color:#fff;font-weight:800;font-size:17px;background:var(--green);box-shadow:0 6px 16px rgba(6,199,85,.35)}
.btn-navy{background:var(--navy);box-shadow:0 6px 16px rgba(11,61,46,.35)}
.btn-ghost{background:#fff;color:#5a6a72;border:1px solid #dfe6ea;font-weight:700;border-radius:16px;padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.muted{color:var(--sub)}
.row{display:flex;gap:8px;padding:6px 0;font-size:14px;line-height:1.5}
.row b{min-width:88px;color:var(--sub);font-weight:800;flex-shrink:0}

.hero{min-height:var(--app-h);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + var(--sat)) calc(20px + var(--sar)) calc(24px + var(--sab)) calc(20px + var(--sal));
  background:linear-gradient(135deg,#0b3d2e,#06C755,#0b3d2e);background-size:200% 200%;animation:gradientShift 12s ease infinite;position:relative;overflow:hidden}
.hero .inner{max-width:440px;width:100%;text-align:center;position:relative;z-index:2}
.hero h1{color:#fff;font-size:28px;font-weight:900;margin:8px 0;line-height:1.35}
.hero p{color:#eafff2;opacity:.9;font-size:14px;line-height:1.7;margin:0 0 18px}
.flabel{font-size:11px;font-weight:900;color:#bfe9d3;text-align:left;margin-bottom:6px}
.nameinput{width:100%;padding:14px 16px;border-radius:14px;border:2px solid transparent;
  background:rgba(0,0,0,.24);color:#fff;font-size:18px;font-weight:800;text-align:center;outline:none;margin-bottom:14px}
.nameinput::placeholder{color:#7fb99a;font-weight:600;font-size:15px}
.nameinput:focus{border-color:#fff;background:rgba(0,0,0,.32)}
.nameinput.err{border-color:var(--red);animation:shake .5s ease}
.engine{display:flex;gap:6px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px;margin-bottom:14px}
.engine button{flex:1;padding:11px 6px;border-radius:10px;font-size:12px;font-weight:800;color:#cfe9db;line-height:1.4;min-height:48px}
.engine button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.engine small{display:block;font-weight:700;font-size:10px;opacity:.75}

/* 選考記録を載せたぶん縦に伸びるので、はみ出したらスクロールできるようにしておく。
   align-items:center + overflow だと上端が切れるため、中央寄せは .inner の margin:auto で行う。 */
.intro{min-height:var(--app-h);display:flex;justify-content:center;color:#fff;
  padding:calc(24px + var(--sat)) calc(20px + var(--sar)) calc(24px + var(--sab)) calc(20px + var(--sal));
  background:linear-gradient(135deg,#08281f,#0b3d2e,#123f31);background-size:200% 200%;animation:gradientShift 10s ease infinite;position:relative;overflow-y:auto}
.intro .inner{max-width:640px;width:100%;text-align:center;position:relative;z-index:2;margin:auto}
.intro .num{font-size:12px;font-weight:900;letter-spacing:.35em;color:#7fd6a5;animation:fadeIn .6s ease}
.intro .big{font-size:66px;font-weight:900;line-height:1;margin:4px 0 8px;text-shadow:0 8px 34px rgba(6,199,85,.55);animation:titleIn .85s cubic-bezier(.2,.9,.3,1)}
.intro .bar{height:3px;background:var(--green);margin:0 auto 16px;width:120px;border-radius:2px;animation:lineSweep .7s ease .35s both}
.intro h2{font-size:25px;font-weight:900;margin:0 0 4px;animation:slideUp .6s ease .2s both}
.intro .sub{font-size:12px;color:#9fd9bb;font-weight:800;margin-bottom:18px;animation:slideUp .6s ease .3s both}
.intro .brief{background:rgba(255,255,255,.09);border-left:3px solid var(--green);border-radius:12px;padding:16px 18px;font-size:15px;line-height:1.85;text-align:left;margin-bottom:14px;animation:slideUp .6s ease .4s both}
.intro .state{display:flex;align-items:center;gap:13px;background:rgba(0,0,0,.28);border-radius:14px;padding:12px 16px;margin-bottom:18px;text-align:left;animation:slideUp .6s ease .5s both}
.intro .state .e{font-size:36px;flex-shrink:0}
.intro .state .t{font-size:11px;color:#8fc6a9;font-weight:800}
.intro .state .v{font-weight:900;font-size:15px}
.intro .meta{font-size:12px;color:#7fd6a5;margin-bottom:16px;animation:slideUp .6s ease .55s both}
/* ステージ導入で読ませる選考記録。面談に入る前のインプットの時間をここで取る。 */
.intro .recwrap{text-align:left;margin-bottom:16px;animation:slideUp .6s ease .45s both}
.intro .rectitle{font-size:11px;font-weight:900;color:#7fd6a5;margin-bottom:7px}
.intro .rectitle span{font-weight:700;color:#8fc6a9}

.meeting{max-width:760px;margin:0 auto;height:var(--app-h);display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.m-head{flex-shrink:0;background:#fff;border-bottom:1px solid #e9edef;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal))}
.m-head .stg{font-weight:900;font-size:14px;flex:1;min-width:0;overflow:hidden}
.m-head .stg small{display:block;font-weight:700;color:var(--sub);font-size:11px}
/* 選考フェーズのステッパー。横幅が足りない端末では横スクロールさせる */
.phasebar{flex-basis:100%;order:3;display:flex;align-items:center;gap:4px;margin-top:7px;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.phasebar::-webkit-scrollbar{display:none}
.phasebar .ph{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#a8b4ba;white-space:nowrap;padding:3px 9px;border-radius:999px;background:#f1f4f6;transition:.3s}
.phasebar .ph i{font-style:normal;font-size:11px}
.phasebar .ph.done{color:#0b7a45;background:#e7f8ee}
.phasebar .ph.now{color:#fff;background:var(--green);box-shadow:0 2px 8px rgba(6,199,85,.35)}
.phasebar .pharrow{color:#cfd8dc;font-weight:900;font-size:12px;flex-shrink:0}
.chbadge{display:inline-block;font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;background:#eef1f3;color:#5a6a72;flex-shrink:0}
.is-line .chbadge{background:var(--green);color:#fff}
.is-line .composer{background:#f6fbf8}
.es-card{background:var(--paper);border:1px solid #ece5d8;border-radius:12px;padding:10px 12px}
.es-q{font-size:10px;font-weight:900;color:#a08a5b;margin-top:9px}
.es-card .es-q:first-child{margin-top:0}
.es-a{font-size:12.5px;line-height:1.65;margin-top:2px}
/* 選考記録。ESと並ぶ「プレイヤーが読める手がかり」なので、ESカードと同格の見た目にする。
   作戦会議・ステージ導入・面談中ドロワーの3箇所で同じ部品を使い回す。 */
.rec{background:#f4faf7;border:1px solid #d9e9e1;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rec:last-child{margin-bottom:0}
.rec .rh{font-size:11px;font-weight:900;color:#0b7a45;margin-bottom:5px}
.rec ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.7}
.rec ul li{margin-bottom:3px}
.rec .rc{font-size:11.5px;color:#6f8a7c;line-height:1.6;border-top:1px dashed #d9e9e1;margin-top:6px;padding-top:5px}
/* ステージ導入は濃い緑地なので、同じ部品の配色だけ反転させる */
.intro .rec{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16);text-align:left}
.intro .rec .rh{color:#7fd6a5}
.intro .rec ul{color:#eafff2}
.intro .rec .rc{color:#9fd9bb;border-top-color:rgba(255,255,255,.16)}
.pips{display:flex;gap:10px;align-items:center;flex-shrink:0}
.pipgroup{display:flex;gap:3px;align-items:center}
.pipgroup .lbl{font-size:9px;color:var(--sub);font-weight:800;margin-right:2px}
.pip{width:9px;height:9px;border-radius:50%;background:#dfe6ea;transition:.4s}
.pip.done{background:var(--green)}
.pip.now{background:var(--amber);animation:breathe 1.4s infinite}
.info-btn{border:1px solid #dfe6ea;background:#fff;border-radius:999px;padding:0 12px;min-height:40px;
  display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:#3c4a51;white-space:nowrap}
.offline-badge{font-size:10px;font-weight:900;background:#fff3cd;color:#8a6d00;border-radius:999px;padding:3px 8px;white-space:nowrap}

.stage-panel{flex-shrink:0;background:linear-gradient(180deg,#123f31,#0b3d2e);color:#fff;position:relative;overflow:hidden;
  padding:14px calc(16px + var(--sar)) 12px calc(16px + var(--sal))}
/* 場面説明。狭い画面やキーボード表示中は行数を丸めるが、消しはしない。
   タップで全文に開けるようにして、「何を書けばいいか」の手がかりを常に取り戻せるようにする。 */
.stage-panel .scene{font-size:12.5px;color:#bfe9d3;background:rgba(255,255,255,.08);padding:7px 11px;border-radius:10px;line-height:1.6;margin-bottom:12px;cursor:pointer}
/* .open が付いているときは、どの画面サイズでも clamp を解除して全文を出す。
   ヒントは .scene の外（兄弟要素）に置く。clamp の内側だと一緒に切り落とされてしまう。 */
.stage-panel .scene.open{display:block!important;-webkit-line-clamp:none!important;overflow:visible!important}
.scene-more{display:none;font-size:11px;font-weight:900;color:#7fd6a5;margin:-8px 0 10px;padding:2px 2px;text-align:left}
.scene-more.show{display:block}
.seat{display:flex;align-items:center;gap:14px}
.avatar{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;background:rgba(255,255,255,.12);flex-shrink:0;position:relative;transition:.5s}
.avatar.pulse{animation:ringPulse 1.2s ease}
.seat .who{flex:1;min-width:0}
/* 名前とタイマーを横並びに。float だと狭い端末で重なる */
.seat .who .nm{font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.seat .who .nmtxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .who .mood{font-size:13px;font-weight:800;margin-top:2px;transition:.4s}
.tempbar{display:flex;gap:4px;margin-top:8px}
.tempbar .seg{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.tempbar .seg .fill{height:100%;width:0;border-radius:999px;transition:.6s}
.temp-note{font-size:10px;color:#8fc6a9;margin-top:5px;text-align:right}
.togaki{min-height:20px;margin-top:10px;font-size:13px;font-style:italic;color:#cfe9db;transition:.3s;opacity:0}
.togaki.show{opacity:1;animation:slideUp .4s ease}

.log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--paper);
  padding:14px calc(16px + var(--sar)) 4px calc(16px + var(--sal));
  background-image:linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px);background-size:100% 30px}
.scene-div{display:flex;align-items:center;gap:10px;margin:14px 0 10px;animation:popIn .4s ease}
.scene-div .line{flex:1;height:1px;background:#e2ddd0}
.scene-div .txt{font-size:11px;font-weight:900;color:#8a7f66;background:#efeadc;padding:3px 12px;border-radius:999px;white-space:nowrap}
.notice{text-align:center;margin:10px 0 14px;animation:popIn .4s ease}
.notice span{display:inline-block;font-size:12px;font-weight:900;background:#fdecea;color:#c62828;border:1px solid #f3c9c6;padding:5px 14px;border-radius:999px}
.turn-row{margin-bottom:14px}
.turn-row .who{font-size:11px;font-weight:900;margin-bottom:3px;color:var(--sub)}
.turn-row.student .who{color:#0b7a45}
.turn-row.you{text-align:right}
.turn-row.you .who{color:#a06a00}
.linecard{display:inline-block;max-width:82%;padding:10px 14px;font-size:15px;line-height:1.6;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.turn-row.student .linecard{background:#fff;border:1px solid #ece7da;border-left:3px solid #0b7a45;color:#2a3439;animation:slideInLeft .35s ease}
.turn-row.you .linecard{background:#fffdf5;border:1px solid #f0e6c8;border-right:3px solid var(--amber);color:#4a3f24;text-align:left;animation:slideInRight .35s ease}
.turn-row.you .linecard.to{background:#fdecea;border-color:#f3c9c6;border-right-color:#c62828;color:#8c2f2b;font-style:italic}
.act-chip{display:inline-block;margin-bottom:5px;font-size:11px;font-weight:800;background:#fff3cd;color:#8a6d00;padding:3px 9px;border-radius:8px}
.reaction{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:900;padding:4px 11px;border-radius:999px;animation:popIn .4s ease}
.typing{display:inline-flex;gap:4px;padding:12px 16px;background:#fff;border:1px solid #ece7da;border-radius:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block}
.typing i:nth-child(1){animation:typing 1s infinite}
.typing i:nth-child(2){animation:typing 1s .18s infinite}
.typing i:nth-child(3){animation:typing 1s .36s infinite}
.errbox{background:#fdecea;border:1px solid #f5c6c2;color:#b3261e;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6;animation:shake .5s ease}
.errbox .acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.errbox button{font-size:12px;font-weight:900;border-radius:9px;padding:0 14px;min-height:42px;flex:1 1 auto}
.errbox .retry{background:#c62828;color:#fff}
.errbox .off{background:#fff;color:#8a6d00;border:1px solid #e6c98a}
.errbox .det{font-size:11px;color:#a06a6a;margin-top:5px;word-break:break-all}

.composer{flex-shrink:0;background:#fff;border-top:1px solid #e9edef;
  padding:9px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal))}
.composer .lbl{font-size:11px;font-weight:900;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.composer .cl-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;font-weight:700;padding:0 13px;min-height:38px;display:inline-flex;align-items:center;
  border-radius:999px;border:1px solid #dfe6ea;background:#fff;color:#5a6a72;transition:.15s}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 8px rgba(6,199,85,.35)}
.composer .field{display:flex;gap:8px;align-items:flex-end}
/* font-size は16px固定（iOSの自動ズーム防止）。入力量に応じて高さを伸ばす。 */
.composer textarea{flex:1;resize:none;border:1px solid #dcdfe2;border-radius:14px;padding:12px;font-size:16px;outline:none;line-height:1.5;
  min-height:50px;max-height:200px;overflow-y:auto}
.composer textarea:focus{border-color:var(--green)}
.composer textarea:disabled{background:#f4f5f6;color:#aaa}
.send{width:50px;height:50px;border-radius:50%;flex-shrink:0;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--green);box-shadow:0 4px 14px rgba(6,199,85,.4)}
.send:disabled{background:#ccc;box-shadow:none}
.cnt{margin-left:auto;flex-shrink:0;font-size:11px;font-weight:800;color:#b6bec3}
.timer{font-size:12px;font-weight:900;color:#3c4a51;background:#f0f3f5;border-radius:999px;padding:5px 10px;min-width:52px;text-align:center;display:inline-block}
.timer.warn{color:#fff;background:var(--amber)}
.timer.low{color:#fff;background:var(--red);animation:urgent 1s ease-in-out infinite}

.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;transform:translateX(102%);transition:.28s cubic-bezier(.2,.7,.3,1);z-index:41;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.drawer.open{transform:translateX(0)}
.drawer .dh{position:sticky;top:0;z-index:1;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:900;

.sect-t{font-size:12px;font-weight:900;margin:16px 0 6px;color:var(--green)}

.report{min-height:var(--app-h);background:var(--bg);
  padding:calc(24px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal))}
.report .badge{display:inline-block;font-size:12px;font-weight:900;color:#fff;background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:10px}
.trend{display:flex;align-items:center;justify-content:center;gap:14px;font-size:40px;margin:6px 0 4px}
.trend .arrow{font-size:22px;color:var(--sub)}
.rep-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.6}
.rep-item:last-child{border-bottom:none}
.rep-item .ic{font-size:18px;flex-shrink:0}

.result{min-height:var(--app-h);background:var(--bg);position:relative;overflow:hidden;
  padding:calc(24px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal))}
/* ボタンは狭い画面で自動的に縦積みになるようにする */
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>*{flex:1 1 150px}
.res-hero{border-radius:20px;padding:26px 22px;text-align:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:18px}
.res-hero.ok{background:linear-gradient(135deg,#0b3d2e,#06C755,#0b3d2e);background-size:200% 200%;animation:gradientShift 8s infinite}
.res-hero.ng{background:linear-gradient(135deg,#5a1a1a,#c62828)}
.res-hero .em{font-size:56px}
.res-hero .quote{background:rgba(0,0,0,.2);border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.7;text-align:left}
/* preserveAspectRatio を外したので、幅に応じて高さも比率どおり縮む（文字が潰れない） */
svg.chart{width:100%;height:auto;display:block}
.fb-stage{font-size:12px;font-weight:900;color:#fff;background:var(--green);border-radius:8px;padding:3px 10px;display:inline-block;margin:14px 0 8px}
.fb{padding:10px 0;border-bottom:1px solid #f2f2f2}
.fb:last-child{border-bottom:none}
.fb .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.fb .tt{font-size:12px;font-weight:800;background:#eef2f5;color:#556;border-radius:6px;padding:2px 8px}
.fb .dl{font-weight:900;font-size:13px;white-space:nowrap}
/* 自分の発言は全文出す。長文でも読めるよう、引用として少し押し出しておく */
.fb .said{font-size:13.5px;line-height:1.75;margin:5px 0;background:#fffdf5;border-left:3px solid var(--amber);border-radius:8px;padding:8px 11px;white-space:pre-wrap;word-break:break-word}
.fb .rz{font-size:13px;background:#f6f9fa;border-radius:10px;padding:7px 10px;margin:3px 0}
.fb .in{font-size:13px;font-style:italic;color:#8e44ad}
.fb .ng{font-size:12px;color:#c62828;margin-top:3px}

/* 模範解答。自分の発言と並べて「どう書けばよかったか」を見せる */
.model{background:#f2fbf5;border:1px solid #cdead9;border-radius:14px;padding:12px 13px;margin-top:12px}
.model .mh{font-size:12px;font-weight:900;color:#0b7a45;margin-bottom:2px}
.model .msub{font-size:11px;color:#6f8a7c;line-height:1.6;margin-bottom:8px}
.model .mi{padding:9px 0;border-top:1px dashed #cdead9}
.model .mi:first-of-type{border-top:none;padding-top:2px}
.model .rn{display:inline-block;font-size:10.5px;font-weight:900;color:#fff;background:#0b7a45;border-radius:6px;padding:2px 8px;margin-bottom:5px}
.model .mt{font-size:13.5px;line-height:1.85;background:#fff;border-radius:10px;padding:9px 11px}
.model .mw{font-size:12.5px;line-height:1.75;color:#4a6b5a;margin-top:6px}
.model .mw b{color:#0b7a45}
.confetti-pieces{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti-pieces i{position:absolute;top:-10px;width:8px;height:12px;animation:confettiFall linear forwards}

.rank{min-height:var(--app-h);display:flex;align-items:center;

  background:linear-gradient(135deg,#111,#2d2d2d,#111);background-size:200% 200%;animation:gradientShift 14s infinite}
.rank .inner{max-width:760px;margin:0 auto;width:100%}
.rrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:13px 18px;margin-bottom:10px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:slideInRight .5s ease both}
.rrow.you{background:linear-gradient(90deg,#0b3d2e,#06C755);color:#fff}
.rrow .pos{font-size:21px;font-weight:900;width:34px;text-align:center;color:#999}
.rrow .em{font-size:27px}
.rrow .nm{flex:1;font-weight:900;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rrow .sc{text-align:right;font-weight:900;font-size:20px}
.rank .tools{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.rank .tools button{font-size:13px;font-weight:800;border-radius:12px;padding:0 20px;min-height:46px;flex:1 1 150px}
.rank .note{color:#888;font-size:11px;margin-top:14px;text-align:center;line-height:1.7}
/* 運営用コンソール（/?admin=1）。参加者の画面には出さない */
.admin-box{background:rgba(255,255,255,.06);border:1px solid #4a3030;border-radius:16px;padding:16px;margin-top:22px}
.admin-box .ah{font-size:13px;font-weight:900;color:#ff8a80;margin-bottom:6px}
.admin-box .ap{font-size:12px;color:#bbb;line-height:1.7;margin:0 0 10px}
.admin-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #555;background:rgba(0,0,0,.35);
  color:#fff;font-size:15px;font-weight:700;outline:none;margin-bottom:10px}
.admin-input:focus{border-color:#ff8a80}
.rank .count{text-align:center;color:#7fd6a5;font-size:12px;font-weight:800;margin-bottom:16px}
.spin{color:#aaa;text-align:center;padding:30px;font-size:14px}

/* ============================================================
   作戦会議：左右見開きレイアウト
   カード5枚を縦積みにすると1画面に収まらず、読む前にスクロールで疲れる。
   広い画面では「左ページ＝攻略対象の学生 / 右ページ＝自社・競合・ルール」に割り、
   中央に綴じ目の罫線を入れて見開きだと一目でわかるようにする。
   狭い画面（〜900px）では従来どおり1カラムに戻る。
   ============================================================ */
.wrap.spread{max-width:760px}
.spread-grid{display:grid;gap:0}
.page{min-width:0}
.spread-foot{margin:0 auto}
@media (min-width:901px){
  .wrap.spread{max-width:1120px}
  .spread-grid{grid-template-columns:1fr 1fr;gap:0 30px}
  .spread-grid>.page+.page{border-left:1px solid #e5ebee;padding-left:30px}
  /* 見開きでは高さが勝負。カード内の余白と行間を少しだけ詰める */
  .spread .card{padding:18px}
  .spread .card>.sect-t:first-child{margin-top:0}
  .spread .rulelist{line-height:1.75}
  /* 左右の下端を揃えるため、各ページ末尾のカードの下余白は開始ボタン側に集約する */
  .spread .page>.card:last-child{margin-bottom:0}
  .spread-foot{max-width:420px;margin-top:20px}
}

/* ============================================================
   スマートフォン最適化
   面談画面は「ヘッダー / 学生パネル / 会話ログ / 入力欄」の4段組で、
   高さの取り合いになる。周辺パーツの余白を削り、会話ログに割ける高さを最大化する。
   ============================================================ */
@media (max-width:600px){
  .wrap{padding:16px calc(14px + var(--sar)) calc(20px + var(--sab)) calc(14px + var(--sal))}
  .card{padding:16px;border-radius:16px;margin-bottom:12px}
  .btn-primary{padding:15px;font-size:16px}
  .btn-ghost{padding:15px}
  .row{font-size:13.5px}
  .row b{min-width:74px}
  .es-a{font-size:13px}

  .hero h1{font-size:25px}
  .hero p{font-size:13px;margin-bottom:16px}
  .intro .big{font-size:56px}
  .intro h2{font-size:22px}
  .intro .sub{font-size:11.5px}
  .intro .brief{font-size:13.5px;line-height:1.8;padding:13px 14px}
  .intro .state{padding:11px 14px;gap:11px}
  .intro .state .e{font-size:32px}

  /* ヘッダー：ステージ名を必ず1行に収める。
     進捗ピップスは「ターン n/2」とフェーズバーで分かるため、狭い画面では省く。 */
  .m-head{padding:calc(7px + var(--sat)) calc(11px + var(--sar)) 7px calc(11px + var(--sal));gap:6px}
  .m-head .stg{font-size:12.5px;white-space:nowrap;text-overflow:ellipsis}
  .m-head .stg small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pips{gap:7px}
  .pipgroup{display:none}
  .offline-badge{font-size:9.5px;padding:3px 7px}
  .info-btn{padding:0 11px;min-height:38px;font-size:11.5px}
  .phasebar{margin-top:6px;gap:3px}
  .phasebar .ph{font-size:9.5px;padding:4px 8px}

  /* 学生パネル */
  .stage-panel{padding:10px calc(14px + var(--sar)) 10px calc(14px + var(--sal))}
  .stage-panel .scene{font-size:11.5px;padding:6px 9px;margin-bottom:9px;line-height:1.55}
  .seat{gap:11px}
  .avatar{width:58px;height:58px;font-size:32px}
  .seat .who .nm{font-size:14.5px}
  .seat .who .mood{font-size:12px}
  .tempbar{margin-top:7px}
  .tempbar .seg{height:7px}
  .temp-note{font-size:9px;margin-top:4px}
  .togaki{font-size:12px;margin-top:8px;min-height:17px}

  /* 会話ログ：吹き出しを広めに取って折り返しを減らす */
  .log{padding:12px calc(12px + var(--sar)) 4px calc(12px + var(--sal))}
  .linecard{max-width:88%;font-size:14.5px;padding:9px 12px}
  .turn-row{margin-bottom:12px}

  /* 入力欄：アクションは折り返さず横スクロール。2行に増えると会話ログを圧迫するため。 */
  .composer{padding:8px calc(12px + var(--sar)) calc(8px + var(--sab)) calc(12px + var(--sal))}
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
    scrollbar-width:none;-ms-overflow-style:none;margin-bottom:7px;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;scroll-snap-align:start;font-size:12.5px}

  /* 結果・ランキング */
  .res-hero{padding:22px 18px}
  .res-hero .em{font-size:48px}
  .fb .said,.fb .rz,.fb .in{font-size:12.5px}
  .rrow{padding:11px 13px;gap:11px}
  .rrow .pos{font-size:19px;width:28px}
  .rrow .em{font-size:23px}
  .rrow .nm{font-size:14.5px}
  .rrow .sc{font-size:18px}
}

/* ソフトキーボード表示中。画面の4割が塞がるので、学生パネルを畳んで会話ログを確保する。
   場面説明は書く手がかりなので消さず、2行に丸めて残す。 */
body.kb .stage-panel{padding-top:8px;padding-bottom:8px}
body.kb .stage-panel .scene{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
body.kb .stage-panel .avatar{width:40px;height:40px;font-size:22px}
body.kb .tempbar{margin-top:5px}
body.kb .tempbar .seg{height:5px}
body.kb .temp-note,body.kb .togaki{display:none}

/* 背の低い端末（iPhone SE 等 568px級）。ヘッダーと学生パネルだけで画面の半分が埋まり、
   会話ログが数十pxしか残らないので、パネル側を削ってログに回す。 */
@media (max-height:700px){
  .stage-panel{padding-top:9px;padding-bottom:9px}
  .stage-panel .scene{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
  .stage-panel .avatar{width:48px;height:48px;font-size:27px}
  .temp-note{display:none}
  .togaki{min-height:0;margin-top:6px}

  /* さらにキーボードが出ると残りは300px前後しかない。
     入力欄と直前のやり取りを最優先し、参照情報は畳む。 */
  body.kb .phasebar{display:none}
  /* ここまで狭くても場面説明は消さない。1行に丸めて残し、タップで全文に開けるようにする */
  body.kb .stage-panel .scene{-webkit-line-clamp:1;margin-bottom:6px}
  body.kb .stage-panel .tempbar{display:none}
  body.kb .stage-panel{padding-top:6px;padding-bottom:6px}
  body.kb .stage-panel .avatar{width:32px;height:32px;font-size:18px}
  body.kb .seat{gap:9px}
  body.kb .seat .who .mood{font-size:11px}
  body.kb .log{padding-top:8px;padding-bottom:2px}
  body.kb .composer textarea{max-height:130px}
}
/* 568px級の端末でキーボードが出ると残りは310px前後。
   入力欄が伸びきると composer だけで画面を使い切ってしまうので、2行分で頭打ちにする。 */
@media (max-height:600px){
  body.kb .composer textarea{max-height:92px}
}

/* 横向き。高さが極端に足りないので学生パネルは名前と温度感だけに絞る */
@media (max-height:480px){
  .stage-panel .scene{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
  .stage-panel .avatar{width:40px;height:40px;font-size:22px}
  .togaki{display:none}
  .m-head .stg small{display:none}
  .composer textarea{max-height:92px}
}

/* 端末の「視差効果を減らす」設定を尊重する */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

<script>

// 選考記録。各選考フェーズで学生が実際に話した内容と、面接官の所感。

    notes:[

    notes:[
      '「3年後は、後輩がつまずいたときに最初に相談される人になっていたい」',

// 未開示の記録をAIプロンプトに渡すと、また「知りようのない情報」で採点されてしまう。
const openRecords = () => RECORDS.filter(r => r.unlockStage <= S.stageIdx + 1);
const COMPANY = {
  self:{ name:'株式会社ブライトキャリア', business:'人材紹介・採用支援（HR Tech）',
    scale:'従業員300名 / 設立15年 / 成長中のベンチャー', treat:'初任給28万 / 平均残業30h / リモート週2',

function pidFor(name){

  for(let i=0;i<name.length;i++){ h=((h<<5)+h+name.charCodeAt(i))>>>0; }

}

/* ============================================================
   発言の質チェック
   AIは放っておくと当たり障りのない一文にも加点しがちなので、
   「挨拶だけ」「短すぎ」「使い回し」といった明らかな手抜きは
   AIの判定を待たず、こちら側で加点の上限を被せる。
   ここが「こんにちは だけで承諾ラインに近づく」のを止める最後の砦。
   ============================================================ */
const GREETING_ONLY_RE = /^(こんにちは|こんばんは|おはようございます|おはよう|はじめまして|お世話になります|お世話になっております|よろしくお願いします|よろしくお願いいたします|よろしく|ありがとうございます|ありがとう|お疲れ様です|了解です|了解|承知しました|はい|どうも)[\s。、,.!！?？…ー~〜]*$/;
// 実質的な中身を測るため、挨拶・定型の相槌・丁寧語の語尾を除いた文字数を数える
const FILLER_RE = /(こんにちは|こんばんは|おはようございます|はじめまして|お世話になっております|お世話になります|よろしくお願いいたします|よろしくお願いします|ありがとうございます|お疲れ様です|なるほど|そうですね|承知しました|了解です|ですね|でしょうか|ください|ます|です|した|さん|ぜひ|とても|本当に)/g;
function contentLength(msg){
  return String(msg||'').replace(FILLER_RE,'').replace(/[\s。、,.!！?？…・ー~〜「」『』（）()]/g,'').length;
}
function bigrams(s){
  const t=String(s||'').replace(/\s+/g,'');
  const out=new Set();
  for(let i=0;i<t.length-1;i++) out.add(t.slice(i,i+2));
  return out;
}
// 2文字単位のJaccard係数。言い回しを少し変えただけの使い回しを拾う
function similarity(a,b){
  const A=bigrams(a), B=bigrams(b);
  if(!A.size||!B.size) return 0;
  let inter=0; A.forEach(x=>{ if(B.has(x)) inter++; });
  return inter/(A.size+B.size-inter);
}
// ESに書かれた固有の話題。ここに触れられるかが「ESを読んだ上での対応か」の目印
const ES_HOOKS = ['カフェ','アルバイト','バイト','新人','教育','マニュアル','離職','裁量','可能性','忙し','続け','聞く','話を聞'];
function esTouched(msg){ const m=String(msg||''); return ES_HOOKS.some(k=>m.includes(k)); }
// 選考記録に出てくる固有の話題。ESと同じ「読んだうえでの対応か」の目印。
// まだ開示されていない記録の語は数えない（触れようのない情報で差がつくのを避ける）。
const RECORD_HOOKS = [
  { unlockStage:1, words:['研修','説明会','スケジュール','3年目'] },
  { unlockStage:2, words:['3人辞め','つまずき','つまずい','支えても','一次面接'] },
  { unlockStage:3, words:['後輩','相談される','ご両親','ご家族','最終面接','3年後'] },
];
function recordHits(msg){
  const m=String(msg||'');
  return RECORD_HOOKS.filter(g=>g.unlockStage<=S.stageIdx+1)
    .reduce((n,g)=>n+g.words.filter(w=>m.includes(w)).length,0);
}

// 「短すぎる」は上限を -1 に留める。短くても狙いに沿った一言（「すぐ決めなくて大丈夫だよ」等）は
// 意図が伝わっている以上マイナスにすべきではなく、それでも長文と同じ加点はさせない、という位置づけ。
// 一方「無言」「中身がない」は据え置き。挨拶だけで承諾ラインに近づくのを止める役目はここが担う。
const QUALITY_CAPS = { '無言':-8, '中身がない':-6, '前と同じことの繰り返し':-5, '短すぎる':-1 };
function analyzeMessage(msg){
  const raw=String(msg||'').trim();
  if(!raw) return { flags:['無言'], cap:QUALITY_CAPS['無言'], es:false };
  const flags=[];
  if(GREETING_ONLY_RE.test(raw) || contentLength(raw)<6) flags.push('中身がない');
  else if(raw.length<12) flags.push('短すぎる');
  const prev=S.history.map(h=>h.message).filter(m=>m && m!==TIMEOUT_MSG);
  if(prev.some(m=>similarity(m,raw)>=0.6)) flags.push('前と同じことの繰り返し');
  const cap = flags.length ? Math.min(...flags.map(f=>QUALITY_CAPS[f])) : null;
  return { flags, cap, es:esTouched(raw) };
}

// 会話履歴を場面（ステージ）ごとに区切って組み立てる。
// 各場面は学生の第一声から始まるので、それも学生の発言として履歴に含める。
// これが無いと2ラリー目で「直前に自分が何を言ったか」を見失い、仕切り直した返答になる。
function historyBlock(){
  const lines=[];
  for(let si=0; si<=S.stageIdx; si++){
    const s=STAGES[si], hs=S.history.filter(h=>h.stageIdx===si);
    if(si!==S.stageIdx && !hs.length) continue;
    lines.push(`【場面${s.id}: ${s.label}】`);
    lines.push(`学生: ${s.opening}`);
    hs.forEach(h=>{
      lines.push(`人事: ${h.message}${h.action&&h.action!=='（発言のみ）'?`（${h.action}）`:''}`);
      lines.push(`学生: ${h.reply}`);
    });
  }
  return lines.join('\n');
}

function buildPrompt(msg, action, timedOut){
  const st=STAGES[S.stageIdx], t=curTurn(), p=PERSONA.public, pv=PERSONA.private, c=COMPANY;
  const hist = historyBlock();
  // 2ラリー目は「同じ会話の続き」。仕切り直させないことがこのブロックの役目。
  const isFirst = S.turnIdx===0;
  const rallyBlock = isFirst
    ? `- ラリー: 1/${TPS}（この場面の1往復目）\n  ※あなた（学生）は直前に「${st.opening}」と発言しています。プレイヤーの発言はそれへの応答です。`

  const timeoutBlock = timedOut ? `\n# ★重要：時間切れ（放置）\nプレイヤーは制限時間内に何も声をかけられませんでした。\n学生の側から見ると「連絡が来ないまま時間だけが過ぎた」状態です。\nこれは学生が最も嫌がる「返信の放置・遅さ」に該当します。\n放置された学生として、戸惑い・不信・気持ちの冷えを反映した反応を返し、deltaは必ずマイナス（-8〜-18程度）にしてください。\nkindは "jirai" とし、ngに「返信の放置・遅さ」を含めてください。\n` : '';

  const es = PERSONA.es;
  const ph = PHASES[t.phase];
  const isLine = t.ch === 'line';
  const chBlock = isLine
    ? `- 接触チャネル: LINE（テキストのみのやり取り）\n  ※表情や間で補えないため、文面そのものの質が全てです。宛名・具体性・長さ・気遣いの有無がそのまま印象になります。\n  ※学生の返信もLINEらしい短いメッセージにすること（1〜2文。絵文字を使うなら1つまで）。`
    : `- 接触チャネル: 対面（面談）\n  ※学生の返信は対面での話し言葉にすること（1〜3文）。`;
  // 手抜き入力を検出したら、学生の反応そのものを変えさせる。

// AI呼び出しの失敗を「利用者向けメッセージ」「再試行してよいか」「原因コード」に分けて持つ。
// サーバー（/api/chat）は { error, message, retryable, retryAfterMs, requestId } を返すので、それをそのまま使う。
function aiError(message, opts){
  const e = new Error(message);
  e.code = opts.code || 'unknown';
  e.retryable = opts.retryable !== false;
  e.status = opts.status;
  e.retryAfterMs = Number(opts.retryAfterMs) || 0;
  e.detail = String(opts.detail || '').slice(0,180);
  return e;
}
async function callStudent(msg, action, timedOut){
  const ac = new AbortController();
  const timer = setTimeout(()=>ac.abort(), CFG.timeoutMs);
  let res;
  try{
    res = await fetch(CFG.endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal: ac.signal,
      body: JSON.stringify({ model: CFG.model, max_tokens: 800, json: true,
        messages:[{ role:'user', content: buildPrompt(msg, action, timedOut) }] }),
    });
  }catch(e){
    if(e && e.name === 'AbortError'){
      throw aiError(`応答が返ってきませんでした（${Math.round(CFG.timeoutMs/1000)}秒でタイムアウト）。`,
        { code:'client_timeout', detail:`client timeout ${CFG.timeoutMs}ms` });
    }
    throw aiError('ネットワークに接続できませんでした。通信環境をご確認ください。',
      { code:'client_network', detail:String((e&&e.message)||e) });
  }finally{
    clearTimeout(timer);
  }

  if(!res.ok){
    let body = null;
    try{ body = await res.json(); }catch(_){}
    const code = (body && body.error) || ('http_'+res.status);
    // サーバーが再試行可否を明示していればそれに従う。無ければステータスから推定。
    const retryable = (body && typeof body.retryable === 'boolean')
      ? body.retryable : (res.status >= 500 || res.status === 429);
    throw aiError((body && body.message) || `サーバーでエラーが発生しました（HTTP ${res.status}）。`,
      { code, retryable, status:res.status, retryAfterMs: body && body.retryAfterMs,
        detail:`${code} / HTTP ${res.status}${body && body.requestId ? ' / id:'+body.requestId : ''}` });
  }

  let data = null;
  try{ data = await res.json(); }
  catch(e){ throw aiError('サーバーの応答を読み取れませんでした。', { code:'bad_response', detail:String((e&&e.message)||e) }); }

  const text = (data.content||[]).filter(b=>b && b.type==='text').map(b=>b.text).join('');
  if(!text) throw aiError('AIの応答が空でした。', { code:'empty_content', detail:'content is empty' });

  try{
    return normalize(parseModelJSON(text));
  }catch(e){
    // JSONが壊れているケース。温度ゆらぎで直ることがあるので再試行対象。
    throw aiError('AIの応答形式が崩れていました。', { code:'bad_format', detail:String((e&&e.message)||e) });
  }
}
function parseModelJSON(raw){
  let t = String(raw||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s<0||e<0) throw new Error('JSONが見つかりません: '+t.slice(0,80));
  t = t.slice(s, e+1);
  try{ return JSON.parse(t); }catch(_){}
  let fixed = t
    .replace(/[\u201C\u201D\u2018\u2019]/g,'')
    .replace(/[\r\n\t]+/g,' ')
    .replace(/:\s*\+(\d)/g,': $1')
    .replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(fixed); }catch(_){}
  const salvaged = looseParse(fixed);
  if(salvaged) return salvaged;
  throw new Error('JSON解析に失敗: '+t.slice(0,100));
}
function looseParse(t){
  const ORDER = ['reply','togaki','delta','kind','reason','inner','ng'];
  const grabStr = (key)=>{
    const ki = t.indexOf('"'+key+'"');
    if(ki<0) return null;
    let j = t.indexOf(':', ki);
    if(j<0) return null;
    j++;
    while(j<t.length && /\s/.test(t[j])) j++;
    if(t[j] !== '"') return null;
    j++;
    let end = t.length;
    for(const k of ORDER){
      if(k===key) continue;
      const p = t.indexOf('"'+k+'"', j);
      if(p>=0 && p<end) end = p;
    }
    let seg = t.slice(j, end);
    seg = seg.replace(/[\s,]*$/,'').replace(/"$/,'').trim();
    return seg.replace(/\\"/g,'"').replace(/\\n/g,' ');
  };
  const reply = grabStr('reply');
  if(!reply) return null;
  const dm = t.match(/"delta"\s*:\s*([+-]?\d+)/);
  const km = t.match(/"kind"\s*:\s*"([a-z]+)"/);
  const nm = t.match(/"ng"\s*:\s*\[([^\]]*)\]/);
  const ng = nm ? (nm[1].match(/"([^"]+)"/g)||[]).map(x=>x.replace(/"/g,'')) : [];
  return { reply, togaki: grabStr('togaki')||'', delta: dm?Number(dm[1]):0,
    kind: km?km[1]:undefined, reason: grabStr('reason')||'—', inner: grabStr('inner')||'—', ng };
}
function normalize(r){
  let delta = Math.round(Number(r.delta)||0);
  delta = Math.max(-25, Math.min(16, delta));
  const kind = KINDS.includes(r.kind) ? r.kind
    : (delta<=-13?'jirai': delta>=10?'sasaru': delta>=4?'good': delta<=-3?'miss':'flat');
  return {
    reply: String(r.reply||'…').slice(0,200),
    togaki: String(r.togaki||'（静かに話を聞いている）').slice(0,60),
    delta, kind,
    // reason はプロンプト側で80字程度を指示しているが、具体を挙げさせるぶん伸びやすい。
    // ここで切ると語中で欠けて納得感を損ねるので、余裕を持たせる。
    reason: String(r.reason||'—').slice(0,200),
    inner: String(r.inner||'—').slice(0,120),
    ng: Array.isArray(r.ng) ? r.ng.slice(0,3).map(x=>String(x).slice(0,40)) : [],
  };
}

// 刺さる語。AIエンジンと違って狙い(aim)を解釈できないので、
// 各ステージの狙い（受け止める・急かさない・本音を引き出す・意思決定を尊重する）に
// 対応する語をここに揃えることで、短くても意図が正しい一言を拾えるようにしている。
const SASARU_RE = /キャリア|成長|失敗|正直|本音|あなた|一緒|意思|尊重|不安|迷|悩|寄り添|大丈夫|応援|向き合|心配|親|ご家族|家族|ゆっくり|焦ら|納得|決めなくて|お任せ|素直|嬉し|おめでと/;
const JIRAI_RE  = /圧迫|詰め|急|早く|絶対|必ず|他社.*(悪|やめ|微妙|比べ物|やば)|うち以外|嘘|盛|とりあえず来/;
// 重複を除いた語数。1語掠めただけで満額加点されると「無難」に点が付いてしまうため
function countHits(re, msg){
  const m = String(msg||'').match(new RegExp(re.source,'g'));
  return m ? new Set(m).size : 0;
}
// 「急かすつもりはありません」を圧迫と誤検出しないよう、否定形が続く場合は地雷とみなさない
function hitsJirai(msg){
  const m = String(msg||'');
  const re = new RegExp(JIRAI_RE.source,'g');
  let x;
  while((x = re.exec(m))){
    const after = m.slice(x.index + x[0].length, x.index + x[0].length + 14);
    if(/(ない|ませ|ず|しないで|せずに|不要)/.test(after)) continue;
    return true;
  }
  return false;
}

    inner:INNER[kind], ng: hitJirai?[PERSONA.private.jirai[0]]:[] };
}

/* ============================================================
   モバイル対応（表示高さとキーボード）
   スマホのブラウザは、アドレスバーの出入りとソフトキーボードで
   「実際に見えている高さ」が刻々と変わる。100vh のまま組むと
   面談画面の入力欄がキーボードの裏に隠れて操作できなくなるため、
   visualViewport の実高さを --app-h に流し込んでレイアウトの基準にする。
   ============================================================ */
const IS_TOUCH = window.matchMedia('(hover:none) and (pointer:coarse)').matches;
const VV = window.visualViewport;
// 「キーボードが出ていない状態の高さ」の基準値。端末ごとに違うので実測の最大値を使う。
let maxViewportH = 0;
function syncViewport(){
  const h = Math.round(VV ? VV.height : window.innerHeight);
  if(h<=0) return;
  document.documentElement.style.setProperty('--app-h', h+'px');
  if(h>maxViewportH) maxViewportH = h;
  // ソフトキーボードで大きく削られている間は学生パネルを畳み、会話ログに高さを回す。
  // アドレスバーの出入り（60〜90px程度）で誤反応しないよう、しきい値は120px。
  // PCのウィンドウ縮小をキーボードと誤認しないよう、タッチ端末に限る。
  document.body.classList.toggle('kb', IS_TOUCH && maxViewportH - h > 120);
  // kb の付け外しで場面説明の丸め方が変わるので、ヒントの出し分けを追随させる
  syncSceneClamp();
}
function scrollLogToEnd(){
  const el=document.getElementById('log');
  if(el) el.scrollTop=el.scrollHeight;
}
/* 場面説明は「何を書けばいいか」の手がかりなので、狭い画面でも消さずに行数だけ丸める。
   実際に丸められているときだけ「全文表示」のヒントを出す。
   キーボードの開閉で丸め方（2行/1行/丸めなし）が変わるので、そのたびに測り直す。 */
function syncSceneClamp(){
  const el=document.getElementById('scene'), more=document.getElementById('scenemore');
  if(!el||!more) return;
  const open = el.classList.contains('open');
  const clamped = !open && el.scrollHeight > el.clientHeight + 1;
  more.textContent = open ? '▴ 場面説明を閉じる' : '▾ 場面説明を全文表示';
  more.classList.toggle('show', open || clamped);
}
function toggleScene(){
  const el=document.getElementById('scene');
  if(!el) return;
  el.classList.toggle('open');
  syncSceneClamp();
}
if(VV){
  // キーボードの開閉で高さが変わる。閉じた分だけログが隠れるので末尾へ寄せ直す。
  VV.addEventListener('resize', ()=>{ syncViewport(); scrollLogToEnd(); });
  VV.addEventListener('scroll', syncViewport);
}
window.addEventListener('resize', syncViewport);
// 回転すると基準の高さそのものが変わるので測り直す。値の確定にも少し間が要る。
window.addEventListener('orientationchange', ()=>{ maxViewportH=0; setTimeout(syncViewport,300); });
syncViewport();

      <div class="row"><b>社風</b><span>${COMPANY.self.culture}</span></div>
      <div class="sect-t" style="color:#d32f2f">■ 競合</div>
      ${COMPANY.rivals.map(r=>`<div style="margin-bottom:6px;font-size:13px"><b>${r.name}</b> <span class="tag" style="background:#fce4ec;color:#c2185b">${r.tag}</span><div class="muted">${r.desc}</div></div>`).join('')}
      <div class="hintbox" style="margin-top:10px">本音・嫌がることは非公開。面談の反応から推理しよう。</div>
    </div>
  </div>`;
  const logEl=document.getElementById('log');
  S.log.forEach(m=>logEl.appendChild(logNode(m)));
  bindInput();setTurnHeader();updateMood(false);startTimer();
  logEl.scrollTop=logEl.scrollHeight;
}

// 入力量に応じて高さを伸ばす。1行から始めて、長文でも上限まで見えるようにする。
// 上限はCSS側に持たせる（画面の高さとキーボードの有無でメディアクエリが切り替わるため）。
// ここで数値を持つと二重管理になり、キーボード表示中だけ噛み合わなくなる。
function growInput(ta){
  if(!ta)return;
  ta.style.height='auto';
  const max=parseFloat(getComputedStyle(ta).maxHeight)||200;
  ta.style.height=Math.min(ta.scrollHeight,max)+'px';
}
function bindInput(){
  const ta=document.getElementById('input'),cnt=document.getElementById('cnt');
  if(!ta)return;
  ta.value=S.input; ta.disabled=false;
  ta.oninput=()=>{S.input=ta.value;cnt.textContent=ta.value.length;growInput(ta);};
  // PCはCtrl/⌘+Enterで送信。スマホのEnterは改行のまま（誤送信を防ぐ）。
  ta.onkeydown=(e)=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); onSend(); } };
  ta.onfocus=()=>setTimeout(scrollLogToEnd,300);
  cnt.textContent=ta.value.length;
  growInput(ta);
  // スマホで毎ターン自動フォーカスすると、勝手にキーボードが開いて場面説明が読めない
  if(!IS_TOUCH) ta.focus();
}
function toggleAction(a){
  if(S.busy||S.timedOut)return;
  S.action=S.action===a?'':a;
  document.querySelectorAll('#chips .chip').forEach(c=>{
    const on=c.dataset.a===S.action;
    c.classList.toggle('on',on);
    // 横スクロールで見切れている選択肢を選んだときに、その位置まで送る
    if(on&&c.scrollIntoView) c.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  });
}
function setTurnHeader(){
  const t=curTurn();
  // aim（そのラリーの狙い）はAIの採点基準として使うだけで、画面には出さない。
  // 出すと答えを教えることになり、ランキングの差がつかなくなる。
  document.getElementById('scene').textContent='📍 '+t.scene;
  syncSceneClamp();
  document.querySelector('.m-head .stg').innerHTML=headHTML();
  document.querySelectorAll('.m-head .pipgroup').forEach((g,i)=>{
    g.querySelectorAll('.pip').forEach((p,j)=>{const gt=i*TPS+j,cur=globalTurn();
      p.className='pip '+(gt<cur?'done':gt===cur?'now':'');});
  });
  // ターンが進むと選考フェーズも接触チャネルも変わるので、ここで追随させる
  const pb=document.getElementById('phasebar'); if(pb) pb.innerHTML=phaseHTML();
  const cm=chanMeta(t);
  const badge=document.getElementById('chbadge'); if(badge) badge.textContent=cm.badge;
  const lbl=document.getElementById('complbl');  if(lbl) lbl.textContent=cm.lbl;
  const ta=document.getElementById('input');     if(ta) ta.placeholder=cm.ph;
  const mt=document.querySelector('.meeting');   if(mt) mt.classList.toggle('is-line', t.ch==='line');
}
function updateMood(animate){
  const mi=moodIndex(S.score),m=MOODS[mi];
  const av=document.getElementById('avatar'),ml=document.getElementById('moodlabel');
  if(!av)return;
  av.textContent=['😨','😕','🧑‍🎓','🙂','😊'][mi];
  ml.textContent=m.em+' '+m.label;ml.style.color=m.color;
  if(animate){av.classList.remove('pulse');void av.offsetWidth;av.classList.add('pulse');}
  document.querySelectorAll('#tempbar .seg .fill').forEach((f,i)=>{
    f.style.width=i<=mi?'100%':'0%';f.style.background=m.color;});
}
function setTogaki(txt){const t=document.getElementById('togaki');if(!t)return;
  t.textContent=txt;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}

function startTimer(){
  S.timeLeft=CFG.turnSeconds; S.timedOut=false;
  const el=document.getElementById('timer'); if(!el) return;
  const paint=()=>{
    const mm=Math.floor(S.timeLeft/60), ss=String(S.timeLeft%60).padStart(2,'0');
    el.textContent=`${mm}:${ss}`;
    el.classList.toggle('warn', S.timeLeft<=CFG.warnSeconds && S.timeLeft>15);
    el.classList.toggle('low',  S.timeLeft<=15);
  };
  paint();
  clearInterval(S.timerId);
  S.timerId=setInterval(()=>{
    if(S.timeLeft>0){ S.timeLeft--; paint(); }
    if(S.timeLeft===0){ clearInterval(S.timerId); onTimeUp(); }
  },1000);
}
function onTimeUp(){
  if(S.busy || S.timedOut) return;
  S.timedOut=true;
  const el=document.getElementById('timer');
  if(el){ el.textContent='時間切れ'; el.className='timer low'; }
  const logEl=document.getElementById('log');
  const nt=document.createElement('div');
  nt.className='notice';
  nt.innerHTML=`<span>⏰ 時間切れ${CFG.autoSubmitOnTimeout?'　—　自動で送信します':''}</span>`;
  logEl.appendChild(nt); logEl.scrollTop=logEl.scrollHeight;

  if(!CFG.autoSubmitOnTimeout){ S.timedOut=false; return; }
  const ta=document.getElementById('input');
  if(ta) ta.disabled=true;
  document.getElementById('send').disabled=true;
  const msg=(S.input||'').trim();
  setTimeout(()=>{
    if(msg){ submitTurn(msg, S.action, false); }
    else   { submitTurn('', S.action, true); }
  }, 900);
}

function onSend(){
  if(S.busy)return;
  const msg=(S.input||'').trim();if(!msg)return;
  submitTurn(msg, S.action, false);
}
function submitTurn(msg, action, timedOut){
  clearInterval(S.timerId);
  const logEl=document.getElementById('log');
  const you={type:'you',text: msg||TIMEOUT_MSG, action, timedOut};
  S.log.push(you); logEl.appendChild(logNode(you));
  S.input=''; S.action='';
  // スマホは送信と同時にキーボードを畳む。学生の反応とト書きが隠れてしまうため。
  const ta=document.getElementById('input'); if(ta){ ta.value=''; if(IS_TOUCH) ta.blur(); growInput(ta); }
  const cnt=document.getElementById('cnt'); if(cnt) cnt.textContent='0';
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('on'));
  logEl.scrollTop=logEl.scrollHeight;
  S.pending={msg,action,timedOut};
  runTurn(msg,action,false,timedOut);
}
function retryTurn(){ if(!S.pending)return; clearTmp(); runTurn(S.pending.msg,S.pending.action,false,S.pending.timedOut); }
function continueOffline(){ if(!S.pending)return; clearTmp(); S.offline=true; runTurn(S.pending.msg,S.pending.action,true,S.pending.timedOut); }

async function runTurn(msg,action,forceOffline,timedOut){
  const logEl=document.getElementById('log');
  S.busy=true;
  const sendBtn=document.getElementById('send'); if(sendBtn) sendBtn.disabled=true;
  const tnode=logNode({type:'typing'}); logEl.appendChild(tnode); logEl.scrollTop=logEl.scrollHeight;

  let r=null,err=null;
  if(CFG.useAI && !forceOffline && !S.offline){
    const aiStart = Date.now();
    for(let attempt=0; attempt<MAX_AI_ATTEMPTS && !r; attempt++){
      try{ r=await callStudent(msg,action,timedOut); err=null; }
      catch(e){
        err=e;
        // 再試行しても直らないエラー（入力不正・APIキー不正・安全性ブロックなど）は即座に諦める
        if(e.retryable===false || attempt===MAX_AI_ATTEMPTS-1) break;
        const wait = Math.min(Math.max(e.retryAfterMs||0, 500*Math.pow(2,attempt)), 4000);
        // 次の試行がターン時間を食いつぶすなら、ここで打ち切ってエラー表示に切り替える
        if(Date.now()-aiStart + wait + CFG.timeoutMs > AI_BUDGET_MS) break;
        await sleep(wait);
      }
    }
  } else {
    await sleep(700);
    r=offlineEngine(msg,action,S.stageIdx,timedOut);
  }
  clearTmp();
  if(!r){
    logEl.appendChild(logNode({type:'error',error:err}));
    logEl.scrollTop=logEl.scrollHeight;
    S.busy=false;
    const sb=document.getElementById('send'); if(sb) sb.disabled=false;
    return;
  }
  applyResult(msg,action,r,timedOut);
}

function applyResult(msg,action,r,timedOut){
  const logEl=document.getElementById('log');
  // AIが甘く採点したときの最後の歯止め。手抜き入力にプラスは絶対に出させない。
  // オフラインエンジンは既に同じ上限を適用済みなので、ここを通っても結果は変わらない。
  if(!timedOut){
    const q=analyzeMessage(msg);
    if(q.cap!=null && r.delta>q.cap){
      r={...r, delta:q.cap, kind:(r.kind==='jirai'?'jirai':'miss'),
         reason:q.flags.join('・')+'。'+r.reason,
         ng:(r.ng&&r.ng.length)?r.ng:q.flags.slice(0,3)};
    }
  }
  S.score=Math.max(0,Math.min(100,S.score+r.delta));
  const dir=r.delta>0?'温度が上がった':r.delta<0?'温度が下がった':'温度は横ばい';
  const sm={type:'student',text:r.reply,kind:r.kind,dir};
  S.log.push(sm);logEl.appendChild(logNode(sm));
  setTogaki(r.togaki);updateMood(true);
  logEl.scrollTop=logEl.scrollHeight;
  S.history.push({stageIdx:S.stageIdx,turnIdx:S.turnIdx,
    label:`${STAGES[S.stageIdx].label}　ラリー${S.turnIdx+1}/${TPS}`, message: msg||TIMEOUT_MSG, action, timedOut,
    reply:r.reply,delta:r.delta,reason:r.reason,inner:r.inner,ng:r.ng,
    scoreAfter:S.score,kind:r.kind});
  S.pending=null; S.busy=false; S.timedOut=false;
  const sb=document.getElementById('send'); if(sb) sb.disabled=false;

  if(S.turnIdx < TPS-1){
    S.turnIdx++;
    setTimeout(()=>{
      pushScene(false);
      logEl.appendChild(logNode(S.log[S.log.length-1]));
      setTurnHeader(); startTimer(); bindInput();
      logEl.scrollTop=logEl.scrollHeight;
    },700);
  } else {
    clearInterval(S.timerId);
    setTimeout(()=>{S.screen='report';render();},900);
  }
}

function logNode(m){
  const d=document.createElement('div');
  if(m.type==='scene'){
    d.className='scene-div';const st=m.stage,t=m.turn;
    // 2ラリー目は同じ場面の続き。新しい場面が始まったように見せない。
    const txt = m.stageOpen ? `Stage ${st.id}　${st.title}｜${st.label}` : `ラリー ${t.rally}/${TPS}　—　会話の続き`;
    d.innerHTML=`<span class="line"></span><span class="txt">${txt}</span><span class="line"></span>`;
    return d;
  }
  // 学生の第一声。まだ評価前なのでリアクションバッジは付けない。
  if(m.type==='said'){
    d.className='turn-row student';
    d.innerHTML=`<div class="who">${PERSONA.public.name}</div><div class="linecard">${esc(m.text)}</div>`;
    return d;
  }
  if(m.type==='you'){
    d.className='turn-row you';
    d.innerHTML=`<div class="who">${esc(S.name)}（人事）</div>
      ${m.action&&m.action!=='（発言のみ）'&&!m.timedOut?`<div class="act-chip">🎬 ${esc(m.action)}</div><br>`:''}
      <div class="linecard ${m.timedOut?'to':''}">${esc(m.text)}</div>`;
    return d;
  }
  if(m.type==='typing'){
    d.className='turn-row student';d.dataset.tmp='1';
    d.innerHTML=`<div class="who">${PERSONA.public.name}</div><div class="typing"><i></i><i></i><i></i></div>`;
    return d;
  }
  if(m.type==='error'){
    const e=m.error||{};
    const hopeless = e.retryable===false;
    d.className='errbox';d.dataset.tmp='1';
    d.innerHTML=`⚠️ ${esc(e.message||'AI応答に失敗しました。ネットワークをご確認ください。')}
      ${hopeless?'<div class="det">※ 同じ内容で送り直しても同じ結果になる可能性が高いです。オフラインでの続行をおすすめします。</div>':''}
      <div class="acts">
        <button class="retry press" onclick="retryTurn()">🔄 もう一度送る</button>
        <button class="off press" onclick="continueOffline()">⚡ オフラインで続行</button>
      </div>
      <div class="det">${esc(e.detail||'')}</div>`;
    return d;
  }
  const R=REACT[m.kind]||REACT.flat;
  d.className='turn-row student';
  d.innerHTML=`<div class="who">${PERSONA.public.name}</div>
    <div class="linecard">${esc(m.text)}</div>
    <br><span class="reaction" style="background:${R.bg};color:${R.fg}">${R.icon} ${R.label}<span style="opacity:.7">・${esc(m.dir)}</span></span>`;
  return d;
}
function clearTmp(){document.querySelectorAll('#log [data-tmp]').forEach(n=>n.remove());}

/* 1ラリー分の振り返りブロック。中間報告と結果総括の両方で使う。
   自分の発言は絶対に切り詰めない。何を書いたか思い出せないまま
   「なぜマイナスなのか」だけ見せられるのが、いちばん納得できない体験になる。 */
function fbBlockHTML(h){
  const re=REACT[h.kind]||REACT.flat;
  return `<div class="fb">
    <div class="top"><span class="tt">${esc(h.label)}${h.timedOut?' ⏰':''}</span>
      <span class="dl" style="color:${h.delta>0?'var(--green)':h.delta<0?'var(--red)':'var(--sub)'}">${re.icon} ${esc(re.label)}　${h.delta>0?'+':''}${h.delta}</span></div>
    <div class="said"><span class="muted">あなた：</span>${esc(h.message)}${h.action&&h.action!=='（発言のみ）'&&!h.timedOut?`（${esc(h.action)}）`:''}</div>
    <div class="rz">💡 ${esc(h.reason)}</div>
    <div class="in">🗨 本音：${esc(h.inner)}</div>
    ${h.ng&&h.ng.length?`<div class="ng">⚠️ 避けたい対応：${h.ng.map(esc).join(' / ')}</div>`:''}
  </div>`;
}

/* 模範解答ブロック。中間報告と結果総括の両方で使う。
   自分が実際に何を書いたかを併記しないと「なるほど」で終わってしまうので、
   自分の発言（あれば）と模範解答を必ず並べて出す。 */
function modelAnswerHTML(st, opts){
  const hs = S.history.filter(h=>h.stageIdx===st.id-1);
  const sub = (opts&&opts.sub) || 'この場面で満点に近い返し方の一例。丸暗記ではなく、どこを具体的に踏み込んでいるかを見てください。';
  return `<div class="model">
    <div class="mh">💡 模範解答｜${esc(st.label)}</div>
    <div class="msub">${sub}</div>
    ${st.model.map((m,i)=>{
      const mine = hs[i];
      return `<div class="mi">
        <span class="rn">ラリー${i+1}</span>
        ${mine?`<div class="mw" style="margin:0 0 6px">あなた：「${esc(mine.message)}」<b style="margin-left:6px">${mine.delta>0?'+':''}${mine.delta}</b></div>`:''}
        <div class="mt">${esc(m.text)}</div>
        <div class="mw"><b>なぜ効くか：</b>${esc(m.why)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

    </div>
    <div class="card">
      <div class="rep-item"><span class="ic">✅</span><div><b>よかった対応</b><br>
        <span class="muted">「${esc(best.message)}」</span><br>${esc(best.reason)}</div></div>
      ${differ?`<div class="rep-item"><span class="ic">🔧</span><div><b>もったいなかった点</b><br>
        <span class="muted">「${esc(worst.message)}」</span><br>${esc(worst.reason)}</div></div>`:''}
      <div class="rep-item"><span class="ic">🧠</span><div><b>学生の今の心境（読み）</b><br>${kokoro}

function lineChart(){
  const pts=[{s:PERSONA.initialScore,d:0},...S.history.map(h=>({s:h.scoreAfter,d:h.delta}))];
  const W=560,H=200,padL=8,padR=8,padT=18,padB=24;
  const maxX=Math.max(1,pts.length-1);
  const x=i=>padL+(W-padL-padR)*(i/maxX);
  const y=v=>H-padB-(H-padT-padB)*(v/100);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.s).toFixed(1)}`).join(' ');
  const thY=y(THRESHOLD);
  const bands=STAGES.map((st,i)=>{
    const a=i*TPS,b=(i+1)*TPS;
    if(a>maxX)return '';
    const x1=x(a),x2=x(Math.min(b,maxX));
    return `<rect x="${x1}" y="${padT}" width="${x2-x1}" height="${H-padT-padB}" fill="${i%2?'#f7f9fa':'#fdfdfd'}"/>
      <text x="${(x1+x2)/2}" y="${padT-4}" font-size="14" fill="#aaa" text-anchor="middle" font-weight="700">Stage ${st.id}</text>`;
  }).join('');
  const dots=pts.map((p,i)=>{
    const c=i===0?'#bbb':p.d>0?'#06C755':p.d<0?'#E5484D':'#bbb';
    return `<circle cx="${x(i)}" cy="${y(p.s)}" r="6" fill="${c}" stroke="#fff" stroke-width="2"/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="志望度スコアの推移">
    ${bands}
    ${[0,25,50,75,100].map(g=>`<line x1="${padL}" x2="${W-padR}" y1="${y(g)}" y2="${y(g)}" stroke="#eee"/>`).join('')}
    <line x1="${padL}" x2="${W-padR}" y1="${thY}" y2="${thY}" stroke="#f5a623" stroke-dasharray="5 4"/>
    <!-- スコアが伸びると右端に折れ線が来るので、ラベルは左に置いて重なりを避ける -->
    <text x="${padL+2}" y="${thY-6}" fill="#f5a623" font-size="16" font-weight="700" text-anchor="start">承諾ライン ${THRESHOLD}</text>
    <path d="${path}" fill="none" stroke="#06C755" stroke-width="3.5" stroke-linejoin="round"/>
    ${dots}
    <text x="${x(0)}" y="${H-5}" font-size="14" fill="#999" text-anchor="start">開始</text>
    <text x="${x(maxX)}" y="${H-5}" font-size="14" fill="#999" text-anchor="end">最終</text>
  </svg>`;
}
function confetti(){
  const cols=['#06C755','#ffd700','#ff6b9d','#4dabf7','#ffa94d','#b197fc'];
  let s='<div class="confetti-pieces">';
  for(let i=0;i<70;i++){const l=Math.random()*100,c=cols[i%cols.length],
    d=(2.4+Math.random()*2.4).toFixed(2),dl=(Math.random()*0.9).toFixed(2),
    r=Math.random()>.5?'50%':'2px';
    s+=`<i style="left:${l}%;background:${c};border-radius:${r};animation-duration:${d}s;animation-delay:${dl}s"></i>`;}
  return s+'</div>';
}

function renderRanking(){
  app.innerHTML=`<div class="rank screen"><div class="inner">
    <h2 style="color:#fff;text-align:center;font-weight:900;margin:0 0 2px">🏆 最終ランキング</h2>
    <p style="text-align:center;color:#aaa;font-size:13px;margin:0 0 6px">内定承諾者 → 志望度スコア順</p>
    <div class="count" id="rcount"></div>
    <div id="rankbody"><div class="spin">📡 参加者のスコアを取得中…</div></div>
    <div class="tools">
      <button class="btn-primary press" style="width:auto" onclick="refreshRanking()">🔄 更新</button>
      <button class="btn-ghost press" onclick="reset()">もう一度プレイ</button>
    </div>
    <p class="note">※ランキングは参加者全員で共有されています。</p>
  </div></div>`;
  refreshRanking();
}
async function refreshRanking(){
  const box=document.getElementById('rankbody');
  const cnt=document.getElementById('rcount');
  if(!box) return;
  box.innerHTML=`<div class="spin">📡 参加者のスコアを取得中…</div>`;
  if(cnt) cnt.textContent='';
  const res = await loadScores();

  if(res.error){
    // 原因コードまで出す。以前は「利用できない環境です」だけで、
    // 環境変数の未設定なのか通信の失敗なのか切り分けられなかった。
    box.innerHTML=`<div class="spin" style="color:#e6a;line-height:1.8">⚠️ ${esc(rankErrorText(res.error))}<br>
      <span style="font-size:11px;color:#888">（自分の結果のみ表示しています）</span></div>`
      + (IS_ADMIN ? '' : rankRow({name:S.name, score:S.score, ok:S.score>=THRESHOLD}, 0, true));
    return;
  }
  const done = res.rows.sort((a,b)=>(b.ok-a.ok)||(b.score-a.score));
  if(cnt){
    const okCount = done.filter(r=>r.ok).length;
    cnt.textContent = done.length ? `参加 ${done.length}人　/　内定承諾 ${okCount}人` : '';
  }
  box.innerHTML = done.length
    ? done.map((r,i)=>rankRow(r,i,r.name===S.name)).join('')
    : `<div class="spin">まだ誰も面談を終えていません。</div>`;
}
function rankRow(r,i,isYou){
  const m=MOODS[moodIndex(r.score)], win=i===0;
  const medal = i===0?'👑' : i===1?'🥈' : i===2?'🥉' : (i+1);
  return `<div class="rrow ${isYou?'you':''}" style="animation-delay:${Math.min(i,10)*0.07}s">
    <div class="pos" style="${isYou?'color:#fff':win?'color:#c9a400':''}">${medal}</div>
    <div class="em">${m.em}</div>
    <div class="nm">${esc(r.name)}${isYou?'（あなた）':''}<div style="font-size:11px;font-weight:700;opacity:.8">${m.label}</div></div>
    <div class="sc">${r.score}<div style="font-size:11px;font-weight:800;color:${r.ok?(isYou?'#c8f7d4':'var(--green)'):(isYou?'#ffcdd2':'#c62828')}">${r.ok?'✅ 承諾':'❌ 辞退'}</div></div>
  </div>`;
}
/* 運営用画面（/?admin=1）。参加者の画面からは到達できない。
   記録の消去はここでしか行えず、合言葉は /api/rank 側でも検証する。 */
function renderAdmin(){
  app.innerHTML=`<div class="rank screen"><div class="inner">
    <h2 style="color:#fff;text-align:center;font-weight:900;margin:0 0 2px">🛠 運営用コンソール</h2>
    <p style="text-align:center;color:#aaa;font-size:13px;margin:0 0 6px">ルーム: ${esc(CFG.room)}</p>
    <div class="count" id="rcount"></div>
    <div id="rankbody"><div class="spin">📡 参加者のスコアを取得中…</div></div>
    <div class="admin-box">
      <div class="ah">🗑 記録の全消去</div>
      <p class="ap">リハーサルのダミー記録は本番前にここで消してください。<b>消すと元に戻せません。</b></p>
      <input id="admtoken" class="admin-input" type="password" autocomplete="off" placeholder="運営の合言葉">
      <button class="btn-ghost press" style="color:#c62828;width:100%" onclick="wipeRanking()">全参加者の記録を消去する</button>
      <div id="admmsg" class="ap" style="margin:8px 0 0"></div>
    </div>
    <div class="tools">
      <button class="btn-primary press" style="width:auto" onclick="refreshRanking()">🔄 更新</button>
    </div>
  </div></div>`;
  refreshRanking();
}
async function wipeRanking(){
  const inp=document.getElementById('admtoken'), msg=document.getElementById('admmsg');
  const token=inp?inp.value.trim():'';
  if(!token){ if(msg) msg.textContent='⚠️ 合言葉を入力してください。'; return; }
  if(!confirm('全参加者のランキング記録を消去します。元に戻せません。よろしいですか？')) return;
  if(!confirm('本当に消去しますか？（最終確認）')) return;
  if(msg) msg.textContent='消去中…';
  const r = await clearScores(token);
  if(msg) msg.textContent = r.ok ? '✅ 記録を消去しました。'
    : (r.error==='bad_admin_token' ? '⚠️ 合言葉が違います。'
      : r.error==='admin_token_not_configured' ? '⚠️ サーバーに合言葉（ADMIN_TOKEN / EVENT_PASS）が設定されていないため消去できません。'
      : '⚠️ 消去に失敗しました：'+rankErrorText(r.error));
  if(r.ok){ if(inp) inp.value=''; refreshRanking(); }
}

function syncDrawer(){
  const dv=document.getElementById('dov'),dr=document.getElementById('drawer');
  if(!dv||!dr)return;
  dv.classList.toggle('open',S.drawer);dr.classList.toggle('open',S.drawer);
  document.body.classList.toggle('noscroll',S.drawer);
  if(S.drawer){
    // キーボードが出たままだとESがほとんど読めないので畳んでから開く
    const ta=document.getElementById('input'); if(ta) ta.blur();
    dr.scrollTop=0;
  }
}
render();
</script>
