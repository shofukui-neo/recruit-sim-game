<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>採用面談シミュレーション</title>
<style>
:root{
  --green:#06C755; --navy:#0b3d2e; --ink:#1f2a30; --sub:#6b7b83;
  --line:#e6ebee; --bg:#eef1f3; --card:#ffffff;
  --red:#E5484D; --amber:#F5A623; --orange:#F57C00; --lime:#7CB342;
  --paper:#faf8f3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea,input{font-family:inherit}
#app{min-height:100vh}

@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(6,199,85,.35)}100%{box-shadow:0 0 0 18px rgba(6,199,85,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(104vh) rotate(680deg);opacity:.85}}
@keyframes titleIn{0%{transform:scale(2.3);opacity:0;filter:blur(10px)}60%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes lineSweep{from{width:0}to{width:120px}}
@keyframes urgent{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.screen{animation:fadeIn .35s ease}
.press{transition:transform .12s ease}
.press:active{transform:scale(.95)}
.lift{transition:transform .2s,box-shadow .2s}
.lift:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.10)}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
.btn-primary{display:block;width:100%;padding:16px;border-radius:16px;color:#fff;font-weight:800;font-size:17px;background:var(--green);box-shadow:0 6px 16px rgba(6,199,85,.35)}
.btn-navy{background:var(--navy);box-shadow:0 6px 16px rgba(11,61,46,.35)}
.btn-ghost{background:#fff;color:#5a6a72;border:1px solid #dfe6ea;font-weight:700;border-radius:16px;padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.muted{color:var(--sub)}
.row{display:flex;gap:8px;padding:6px 0;font-size:14px;line-height:1.5}
.row b{min-width:88px;color:var(--sub);font-weight:800;flex-shrink:0}

.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,#0b3d2e,#06C755,#0b3d2e);background-size:200% 200%;animation:gradientShift 12s ease infinite;position:relative;overflow:hidden}
.hero .inner{max-width:440px;width:100%;text-align:center;position:relative;z-index:2}
.hero h1{color:#fff;font-size:28px;font-weight:900;margin:8px 0;line-height:1.35}
.hero p{color:#eafff2;opacity:.9;font-size:14px;line-height:1.7;margin:0 0 18px}
.flabel{font-size:11px;font-weight:900;color:#bfe9d3;text-align:left;margin-bottom:6px}
.nameinput{width:100%;padding:14px 16px;border-radius:14px;border:2px solid transparent;
  background:rgba(0,0,0,.24);color:#fff;font-size:18px;font-weight:800;text-align:center;outline:none;margin-bottom:14px}
.nameinput::placeholder{color:#7fb99a;font-weight:600;font-size:15px}
.nameinput:focus{border-color:#fff;background:rgba(0,0,0,.32)}
.nameinput.err{border-color:var(--red);animation:shake .5s ease}
.engine{display:flex;gap:6px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px;margin-bottom:14px}
.engine button{flex:1;padding:9px 6px;border-radius:10px;font-size:12px;font-weight:800;color:#cfe9db;line-height:1.4}
.engine button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.engine small{display:block;font-weight:700;font-size:10px;opacity:.75}

.intro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;
  background:linear-gradient(135deg,#08281f,#0b3d2e,#123f31);background-size:200% 200%;animation:gradientShift 10s ease infinite;position:relative;overflow:hidden}
.intro .inner{max-width:480px;width:100%;text-align:center;position:relative;z-index:2}
.intro .num{font-size:12px;font-weight:900;letter-spacing:.35em;color:#7fd6a5;animation:fadeIn .6s ease}
.intro .big{font-size:66px;font-weight:900;line-height:1;margin:4px 0 8px;text-shadow:0 8px 34px rgba(6,199,85,.55);animation:titleIn .85s cubic-bezier(.2,.9,.3,1)}
.intro .bar{height:3px;background:var(--green);margin:0 auto 16px;width:120px;border-radius:2px;animation:lineSweep .7s ease .35s both}
.intro h2{font-size:25px;font-weight:900;margin:0 0 4px;animation:slideUp .6s ease .2s both}
.intro .sub{font-size:12px;color:#9fd9bb;font-weight:800;margin-bottom:18px;animation:slideUp .6s ease .3s both}
.intro .brief{background:rgba(255,255,255,.09);border-left:3px solid var(--green);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.85;text-align:left;margin-bottom:14px;animation:slideUp .6s ease .4s both}
.intro .state{display:flex;align-items:center;gap:13px;background:rgba(0,0,0,.28);border-radius:14px;padding:12px 16px;margin-bottom:18px;text-align:left;animation:slideUp .6s ease .5s both}
.intro .state .e{font-size:36px;flex-shrink:0}
.intro .state .t{font-size:11px;color:#8fc6a9;font-weight:800}
.intro .state .v{font-weight:900;font-size:15px}
.intro .meta{font-size:12px;color:#7fd6a5;margin-bottom:16px;animation:slideUp .6s ease .55s both}

.meeting{max-width:680px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.m-head{flex-shrink:0;background:#fff;border-bottom:1px solid #e9edef;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.m-head .stg{font-weight:900;font-size:14px}
.m-head .stg small{display:block;font-weight:700;color:var(--sub);font-size:11px}
/* 選考フェーズのステッパー。横幅が足りない端末では横スクロールさせる */
.phasebar{flex-basis:100%;order:3;display:flex;align-items:center;gap:4px;margin-top:7px;overflow-x:auto;padding-bottom:2px}
.phasebar .ph{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#a8b4ba;white-space:nowrap;padding:3px 9px;border-radius:999px;background:#f1f4f6;transition:.3s}
.phasebar .ph i{font-style:normal;font-size:11px}
.phasebar .ph.done{color:#0b7a45;background:#e7f8ee}
.phasebar .ph.now{color:#fff;background:var(--green);box-shadow:0 2px 8px rgba(6,199,85,.35)}
.phasebar .pharrow{color:#cfd8dc;font-weight:900;font-size:12px;flex-shrink:0}
.chbadge{display:inline-block;font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;background:#eef1f3;color:#5a6a72;margin-right:6px}
.is-line .chbadge{background:var(--green);color:#fff}
.is-line .composer{background:#f6fbf8}
.es-card{background:var(--paper);border:1px solid #ece5d8;border-radius:12px;padding:10px 12px}
.es-q{font-size:10px;font-weight:900;color:#a08a5b;margin-top:9px}
.es-card .es-q:first-child{margin-top:0}
.es-a{font-size:12.5px;line-height:1.65;margin-top:2px}
.pips{display:flex;gap:10px;align-items:center}
.pipgroup{display:flex;gap:3px;align-items:center}
.pipgroup .lbl{font-size:9px;color:var(--sub);font-weight:800;margin-right:2px}
.pip{width:9px;height:9px;border-radius:50%;background:#dfe6ea;transition:.4s}
.pip.done{background:var(--green)}
.pip.now{background:var(--amber);animation:breathe 1.4s infinite}
.info-btn{border:1px solid #dfe6ea;background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;color:#3c4a51}
.offline-badge{font-size:10px;font-weight:900;background:#fff3cd;color:#8a6d00;border-radius:999px;padding:3px 8px;white-space:nowrap}

.stage-panel{flex-shrink:0;background:linear-gradient(180deg,#123f31,#0b3d2e);color:#fff;padding:14px 16px 12px;position:relative;overflow:hidden}
.stage-panel .scene{font-size:12px;color:#bfe9d3;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:10px;line-height:1.55;margin-bottom:12px}
.seat{display:flex;align-items:center;gap:14px}
.avatar{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;background:rgba(255,255,255,.12);flex-shrink:0;position:relative;transition:.5s}
.avatar.pulse{animation:ringPulse 1.2s ease}
.seat .who{flex:1;min-width:0}
.seat .who .nm{font-weight:900;font-size:16px}
.seat .who .mood{font-size:13px;font-weight:800;margin-top:2px;transition:.4s}
.tempbar{display:flex;gap:4px;margin-top:8px}
.tempbar .seg{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.tempbar .seg .fill{height:100%;width:0;border-radius:999px;transition:.6s}
.temp-note{font-size:10px;color:#8fc6a9;margin-top:5px;text-align:right}
.togaki{min-height:20px;margin-top:10px;font-size:13px;font-style:italic;color:#cfe9db;transition:.3s;opacity:0}
.togaki.show{opacity:1;animation:slideUp .4s ease}

.log{flex:1;overflow-y:auto;padding:14px 16px 4px;background:var(--paper);
  background-image:linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px);background-size:100% 30px}
.scene-div{display:flex;align-items:center;gap:10px;margin:14px 0 10px;animation:popIn .4s ease}
.scene-div .line{flex:1;height:1px;background:#e2ddd0}
.scene-div .txt{font-size:11px;font-weight:900;color:#8a7f66;background:#efeadc;padding:3px 12px;border-radius:999px;white-space:nowrap}
.notice{text-align:center;margin:10px 0 14px;animation:popIn .4s ease}
.notice span{display:inline-block;font-size:12px;font-weight:900;background:#fdecea;color:#c62828;border:1px solid #f3c9c6;padding:5px 14px;border-radius:999px}
.turn-row{margin-bottom:14px}
.turn-row .who{font-size:11px;font-weight:900;margin-bottom:3px;color:var(--sub)}
.turn-row.student .who{color:#0b7a45}
.turn-row.you{text-align:right}
.turn-row.you .who{color:#a06a00}
.linecard{display:inline-block;max-width:82%;padding:10px 14px;font-size:15px;line-height:1.6;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.turn-row.student .linecard{background:#fff;border:1px solid #ece7da;border-left:3px solid #0b7a45;color:#2a3439;animation:slideInLeft .35s ease}
.turn-row.you .linecard{background:#fffdf5;border:1px solid #f0e6c8;border-right:3px solid var(--amber);color:#4a3f24;text-align:left;animation:slideInRight .35s ease}
.turn-row.you .linecard.to{background:#fdecea;border-color:#f3c9c6;border-right-color:#c62828;color:#8c2f2b;font-style:italic}
.act-chip{display:inline-block;margin-bottom:5px;font-size:11px;font-weight:800;background:#fff3cd;color:#8a6d00;padding:3px 9px;border-radius:8px}
.reaction{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:900;padding:4px 11px;border-radius:999px;animation:popIn .4s ease}
.typing{display:inline-flex;gap:4px;padding:12px 16px;background:#fff;border:1px solid #ece7da;border-radius:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block}
.typing i:nth-child(1){animation:typing 1s infinite}
.typing i:nth-child(2){animation:typing 1s .18s infinite}
.typing i:nth-child(3){animation:typing 1s .36s infinite}
.errbox{background:#fdecea;border:1px solid #f5c6c2;color:#b3261e;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6;animation:shake .5s ease}
.errbox .acts{display:flex;gap:8px;margin-top:9px}
.errbox button{font-size:12px;font-weight:900;border-radius:9px;padding:8px 12px}
.errbox .retry{background:#c62828;color:#fff}
.errbox .off{background:#fff;color:#8a6d00;border:1px solid #e6c98a}
.errbox .det{font-size:11px;color:#a06a6a;margin-top:5px;word-break:break-all}

.composer{flex-shrink:0;background:#fff;border-top:1px solid #e9edef;padding:10px 14px 14px}
.composer .lbl{font-size:11px;font-weight:900;color:var(--sub);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid #dfe6ea;background:#fff;color:#5a6a72;transition:.15s}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 8px rgba(6,199,85,.35)}
.composer .field{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid #dcdfe2;border-radius:14px;padding:10px 12px;font-size:15px;outline:none;line-height:1.5}
.composer textarea:focus{border-color:var(--green)}
.composer textarea:disabled{background:#f4f5f6;color:#aaa}
.send{width:50px;height:50px;border-radius:50%;flex-shrink:0;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--green);box-shadow:0 4px 14px rgba(6,199,85,.4)}
.send:disabled{background:#ccc;box-shadow:none}
.cnt{text-align:right;font-size:11px;color:#bbb;margin-top:3px}
.timer{font-size:12px;font-weight:900;color:#3c4a51;background:#f0f3f5;border-radius:999px;padding:5px 10px;min-width:52px;text-align:center;display:inline-block}
.timer.warn{color:#fff;background:var(--amber)}
.timer.low{color:#fff;background:var(--red);animation:urgent 1s ease-in-out infinite}

.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,88vw);background:#fff;transform:translateX(102%);transition:.28s cubic-bezier(.2,.7,.3,1);z-index:41;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.drawer.open{transform:translateX(0)}
.drawer .dh{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.drawer .dh button{color:#fff;font-size:20px;line-height:1}
.drawer .body{padding:16px}
.sect-t{font-size:12px;font-weight:900;margin:16px 0 6px;color:var(--green)}
.hintbox{background:#fff8e1;color:#8a6d00;font-size:12px;padding:8px 10px;border-radius:10px;line-height:1.6}

.report{min-height:100vh;padding:24px 16px;background:var(--bg)}
.report .badge{display:inline-block;font-size:12px;font-weight:900;color:#fff;background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:10px}
.trend{display:flex;align-items:center;justify-content:center;gap:14px;font-size:40px;margin:6px 0 4px}
.trend .arrow{font-size:22px;color:var(--sub)}
.rep-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.6}
.rep-item:last-child{border-bottom:none}
.rep-item .ic{font-size:18px;flex-shrink:0}

.result{min-height:100vh;padding:24px 16px;background:var(--bg);position:relative;overflow:hidden}
.res-hero{border-radius:20px;padding:26px 22px;text-align:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:18px}
.res-hero.ok{background:linear-gradient(135deg,#0b3d2e,#06C755,#0b3d2e);background-size:200% 200%;animation:gradientShift 8s infinite}
.res-hero.ng{background:linear-gradient(135deg,#5a1a1a,#c62828)}
.res-hero .em{font-size:56px}
.res-hero .quote{background:rgba(0,0,0,.2);border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.7;text-align:left}
svg.chart{width:100%;height:200px;display:block}
.fb-stage{font-size:12px;font-weight:900;color:#fff;background:var(--green);border-radius:8px;padding:3px 10px;display:inline-block;margin:14px 0 8px}
.fb{padding:10px 0;border-bottom:1px solid #f2f2f2}
.fb:last-child{border-bottom:none}
.fb .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fb .tt{font-size:12px;font-weight:800;background:#eef2f5;color:#556;border-radius:6px;padding:2px 8px}
.fb .dl{font-weight:900;font-size:14px}
.fb .said{font-size:13px;margin:3px 0}
.fb .rz{font-size:13px;background:#f6f9fa;border-radius:10px;padding:7px 10px;margin:3px 0}
.fb .in{font-size:13px;font-style:italic;color:#8e44ad}
.fb .ng{font-size:12px;color:#c62828;margin-top:3px}
.confetti-pieces{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti-pieces i{position:absolute;top:-10px;width:8px;height:12px;animation:confettiFall linear forwards}

.rank{min-height:100vh;padding:26px 16px;display:flex;align-items:center;
  background:linear-gradient(135deg,#111,#2d2d2d,#111);background-size:200% 200%;animation:gradientShift 14s infinite}
.rank .inner{max-width:640px;margin:0 auto;width:100%}
.rrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:13px 18px;margin-bottom:10px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:slideInRight .5s ease both}
.rrow.you{background:linear-gradient(90deg,#0b3d2e,#06C755);color:#fff}
.rrow .pos{font-size:21px;font-weight:900;width:34px;text-align:center;color:#999}
.rrow .em{font-size:27px}
.rrow .nm{flex:1;font-weight:900;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rrow .sc{text-align:right;font-weight:900;font-size:20px}
.rank .tools{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.rank .tools button{font-size:13px;font-weight:800;border-radius:12px;padding:11px 20px}
.rank .note{color:#888;font-size:11px;margin-top:14px;text-align:center;line-height:1.7}
.rank .count{text-align:center;color:#7fd6a5;font-size:12px;font-weight:800;margin-bottom:16px}
.spin{color:#aaa;text-align:center;padding:30px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CFG = {
  useAI: true,
  endpoint: '/api/chat',
  model: 'gemini-2.5-flash',
  turnSeconds: 180,
  warnSeconds: 30,
  autoSubmitOnTimeout: true,
  timeoutMs: 30000,
  room: 'mochica0722',
};
const TPS = 2;
const NAME_MAX = 12;
// AI呼び出しの最大試行回数（初回 + 再試行2回）。サーバー側でも再試行するので、ここは控えめに。
const MAX_AI_ATTEMPTS = 3;
// 1ターンでAI待ちに費やしてよい上限。制限時間180秒のゲーム進行を止めないための保険。
const AI_BUDGET_MS = 60000;

const PERSONA = {
  public:{ name:'佐藤 みなと', university:'私立大学 経済学部（文系）', grade:'学部4年',
    industries:'人材 / IT / 広告 など幅広く', axis:'若いうちから成長できる環境・人の役に立つ実感' },
  // エントリーシート。説明会当日に提出済みで、プレイヤーは最初から読める。
  // ここに書かれた固有名詞に触れられるかどうかが「パーソナライズ度」の判定材料になる。
  es:{
    motivation:'人の可能性を広げる仕事がしたいです。説明会で伺った「若手でも裁量が大きい」という点に強く惹かれました。',
    gakuchika:'カフェのアルバイトで新人教育を担当しました。マニュアルが形骸化していたので作り直し、半年で新人の離職を3割減らしました。',
    selfPR:'相手の話を最後まで聞いて、本当に困っていることを見つけるのが得意です。',
    concern:'ベンチャーは成長できそうですが、忙しすぎて長く続けられないのではないかという不安があります。',

/* ============================================================
   発言の質チェック
   AIは放っておくと当たり障りのない一文にも加点しがちなので、
   「挨拶だけ」「短すぎ」「使い回し」といった明らかな手抜きは
   AIの判定を待たず、こちら側で加点の上限を被せる。
   ここが「こんにちは だけで承諾ラインに近づく」のを止める最後の砦。
   ============================================================ */
const GREETING_ONLY_RE = /^(こんにちは|こんばんは|おはようございます|おはよう|はじめまして|お世話になります|お世話になっております|よろしくお願いします|よろしくお願いいたします|よろしく|ありがとうございます|ありがとう|お疲れ様です|了解です|了解|承知しました|はい|どうも)[\s。、,.!！?？…ー~〜]*$/;
// 実質的な中身を測るため、挨拶・定型の相槌・丁寧語の語尾を除いた文字数を数える
const FILLER_RE = /(こんにちは|こんばんは|おはようございます|はじめまして|お世話になっております|お世話になります|よろしくお願いいたします|よろしくお願いします|ありがとうございます|お疲れ様です|なるほど|そうですね|承知しました|了解です|ですね|でしょうか|ください|ます|です|した|さん|ぜひ|とても|本当に)/g;
function contentLength(msg){
  return String(msg||'').replace(FILLER_RE,'').replace(/[\s。、,.!！?？…・ー~〜「」『』（）()]/g,'').length;
}
function bigrams(s){
  const t=String(s||'').replace(/\s+/g,'');
  const out=new Set();
  for(let i=0;i<t.length-1;i++) out.add(t.slice(i,i+2));
  return out;
}
// 2文字単位のJaccard係数。言い回しを少し変えただけの使い回しを拾う
function similarity(a,b){
  const A=bigrams(a), B=bigrams(b);
  if(!A.size||!B.size) return 0;
  let inter=0; A.forEach(x=>{ if(B.has(x)) inter++; });
  return inter/(A.size+B.size-inter);
}
// ESに書かれた固有の話題。ここに触れられるかが「ESを読んだ上での対応か」の目印
const ES_HOOKS = ['カフェ','アルバイト','バイト','新人','教育','マニュアル','離職','裁量','可能性','忙し','続け','聞く','話を聞'];
function esTouched(msg){ const m=String(msg||''); return ES_HOOKS.some(k=>m.includes(k)); }

const QUALITY_CAPS = { '無言':-8, '中身がない':-6, '前と同じことの繰り返し':-5, '短すぎる':-3 };
function analyzeMessage(msg){
  const raw=String(msg||'').trim();
  if(!raw) return { flags:['無言'], cap:QUALITY_CAPS['無言'], es:false };
  const flags=[];
  if(GREETING_ONLY_RE.test(raw) || contentLength(raw)<6) flags.push('中身がない');
  else if(raw.length<15) flags.push('短すぎる');
  const prev=S.history.map(h=>h.message).filter(m=>m && m!==TIMEOUT_MSG);
  if(prev.some(m=>similarity(m,raw)>=0.6)) flags.push('前と同じことの繰り返し');
  const cap = flags.length ? Math.min(...flags.map(f=>QUALITY_CAPS[f])) : null;
  return { flags, cap, es:esTouched(raw) };
}

// AI呼び出しの失敗を「利用者向けメッセージ」「再試行してよいか」「原因コード」に分けて持つ。
// サーバー（/api/chat）は { error, message, retryable, retryAfterMs, requestId } を返すので、それをそのまま使う。
function aiError(message, opts){
  const e = new Error(message);
  e.code = opts.code || 'unknown';
  e.retryable = opts.retryable !== false;
  e.status = opts.status;
  e.retryAfterMs = Number(opts.retryAfterMs) || 0;
  e.detail = String(opts.detail || '').slice(0,180);
  return e;
}
async function callStudent(msg, action, timedOut){
  const ac = new AbortController();
  const timer = setTimeout(()=>ac.abort(), CFG.timeoutMs);
  let res;
  try{
    res = await fetch(CFG.endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal: ac.signal,
      body: JSON.stringify({ model: CFG.model, max_tokens: 800, json: true,
        messages:[{ role:'user', content: buildPrompt(msg, action, timedOut) }] }),
    });
  }catch(e){
    if(e && e.name === 'AbortError'){
      throw aiError(`応答が返ってきませんでした（${Math.round(CFG.timeoutMs/1000)}秒でタイムアウト）。`,
        { code:'client_timeout', detail:`client timeout ${CFG.timeoutMs}ms` });
    }
    throw aiError('ネットワークに接続できませんでした。通信環境をご確認ください。',
      { code:'client_network', detail:String((e&&e.message)||e) });
  }finally{
    clearTimeout(timer);
  }

  if(!res.ok){
    let body = null;
    try{ body = await res.json(); }catch(_){}
    const code = (body && body.error) || ('http_'+res.status);
    // サーバーが再試行可否を明示していればそれに従う。無ければステータスから推定。
    const retryable = (body && typeof body.retryable === 'boolean')
      ? body.retryable : (res.status >= 500 || res.status === 429);
    throw aiError((body && body.message) || `サーバーでエラーが発生しました（HTTP ${res.status}）。`,
      { code, retryable, status:res.status, retryAfterMs: body && body.retryAfterMs,
        detail:`${code} / HTTP ${res.status}${body && body.requestId ? ' / id:'+body.requestId : ''}` });
  }

  let data = null;
  try{ data = await res.json(); }
  catch(e){ throw aiError('サーバーの応答を読み取れませんでした。', { code:'bad_response', detail:String((e&&e.message)||e) }); }

  const text = (data.content||[]).filter(b=>b && b.type==='text').map(b=>b.text).join('');
  if(!text) throw aiError('AIの応答が空でした。', { code:'empty_content', detail:'content is empty' });

  try{
    return normalize(parseModelJSON(text));
  }catch(e){
    // JSONが壊れているケース。温度ゆらぎで直ることがあるので再試行対象。
    throw aiError('AIの応答形式が崩れていました。', { code:'bad_format', detail:String((e&&e.message)||e) });
  }
}
function parseModelJSON(raw){
  let t = String(raw||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s<0||e<0) throw new Error('JSONが見つかりません: '+t.slice(0,80));
  t = t.slice(s, e+1);
  try{ return JSON.parse(t); }catch(_){}
  let fixed = t
    .replace(/[\u201C\u201D\u2018\u2019]/g,'')
    .replace(/[\r\n\t]+/g,' ')
    .replace(/:\s*\+(\d)/g,': $1')
    .replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(fixed); }catch(_){}
  const salvaged = looseParse(fixed);
  if(salvaged) return salvaged;
  throw new Error('JSON解析に失敗: '+t.slice(0,100));
}
function looseParse(t){
  const ORDER = ['reply','togaki','delta','kind','reason','inner','ng'];
  const grabStr = (key)=>{
    const ki = t.indexOf('"'+key+'"');
    if(ki<0) return null;
    let j = t.indexOf(':', ki);
    if(j<0) return null;
    j++;
    while(j<t.length && /\s/.test(t[j])) j++;
    if(t[j] !== '"') return null;
    j++;
    let end = t.length;
    for(const k of ORDER){
      if(k===key) continue;
      const p = t.indexOf('"'+k+'"', j);
      if(p>=0 && p<end) end = p;
    }
    let seg = t.slice(j, end);
    seg = seg.replace(/[\s,]*$/,'').replace(/"$/,'').trim();
    return seg.replace(/\\"/g,'"').replace(/\\n/g,' ');
  };
  const reply = grabStr('reply');
  if(!reply) return null;
  const dm = t.match(/"delta"\s*:\s*([+-]?\d+)/);
  const km = t.match(/"kind"\s*:\s*"([a-z]+)"/);
  const nm = t.match(/"ng"\s*:\s*\[([^\]]*)\]/);
  const ng = nm ? (nm[1].match(/"([^"]+)"/g)||[]).map(x=>x.replace(/"/g,'')) : [];
  return { reply, togaki: grabStr('togaki')||'', delta: dm?Number(dm[1]):0,
    kind: km?km[1]:undefined, reason: grabStr('reason')||'—', inner: grabStr('inner')||'—', ng };
}
function normalize(r){
  let delta = Math.round(Number(r.delta)||0);
  delta = Math.max(-25, Math.min(16, delta));
  const kind = KINDS.includes(r.kind) ? r.kind
    : (delta<=-13?'jirai': delta>=10?'sasaru': delta>=4?'good': delta<=-3?'miss':'flat');
  return {
    reply: String(r.reply||'…').slice(0,200),
    togaki: String(r.togaki||'（静かに話を聞いている）').slice(0,60),
    delta, kind,
    reason: String(r.reason||'—').slice(0,140),
    inner: String(r.inner||'—').slice(0,120),
    ng: Array.isArray(r.ng) ? r.ng.slice(0,3).map(x=>String(x).slice(0,40)) : [],
  };
}

const SASARU_RE = /キャリア|成長|失敗|正直|本音|あなた|一緒|意思|尊重|不安|迷|悩|寄り添|大丈夫|応援|向き合/;
const JIRAI_RE  = /圧迫|詰め|急|早く|絶対|必ず|他社.*(悪|やめ|微妙|比べ物|やば)|うち以外|嘘|盛|とりあえず来/;
// 重複を除いた語数。1語掠めただけで満額加点されると「無難」に点が付いてしまうため
function countHits(re, msg){
  const m = String(msg||'').match(new RegExp(re.source,'g'));
  return m ? new Set(m).size : 0;
}
// 「急かすつもりはありません」を圧迫と誤検出しないよう、否定形が続く場合は地雷とみなさない
function hitsJirai(msg){
  const m = String(msg||'');
  const re = new RegExp(JIRAI_RE.source,'g');
  let x;
  while((x = re.exec(m))){
    const after = m.slice(x.index + x[0].length, x.index + x[0].length + 14);
    if(/(ない|ませ|ず|しないで|せずに|不要)/.test(after)) continue;
    return true;
  }
  return false;
}
function offlineEngine(msg, action, si, timedOut){
  if(timedOut && !msg){
    return { reply:'…（連絡がないまま、時間が過ぎてしまった）', togaki:'（不安げに何度もスマホを確認している…）',
      delta:-12, kind:'jirai', reason:'制限時間内に声をかけられず放置。地雷（返信の放置・遅さ）に直撃。',
      inner:'連絡、来ないな…。私、そんなに興味を持たれてないのかも。', ng:['返信の放置・遅さ'] };
  }
  const q = analyzeMessage(msg);
  // 基準は-3。何もしなければ気持ちは少しずつ冷めていく、が既定値。
  // 共感語を1つ掠めただけで加点されると「無難」に点が付いてしまうので、
  // 加点の主軸は「ESへの言及」と「具体性（文量）」に置き、共感語は薄く効かせる。
  let delta=-3, hitJirai=false;
  if(['面談を設定','社員を紹介','オフィス見学'].includes(action)) delta+=4;
  else if(action==='食事に誘う') delta+=3;
  else if(action==='資料を送付') delta+=2;
  delta += Math.min(3, countHits(SASARU_RE, msg));
  delta += Math.min(9, 3*ES_HOOKS.filter(k=>msg.includes(k)).length);  // ESへの言及が最大の得点源
  if(hitsJirai(msg)){ delta-=14; hitJirai=true; }
  if(msg.length>=100) delta+=3; else if(msg.length>=60) delta+=2; else if(msg.length>=30) delta+=1;
  if(si>=2) delta+=1;
  if(q.cap!=null) delta=Math.min(delta,q.cap);   // 手抜きは上限を被せる
  delta = Math.max(-22, Math.min(16, delta));
  const kind = hitJirai?'jirai' : delta>=10?'sasaru' : delta>=4?'good' : delta<=-3?'miss' : 'flat';
  const TOGAKI={jirai:'（表情が固くなり、少し身を引いた…）',sasaru:'（目を見て、少し前のめりになった）',
    good:'（小さくうなずいた）',miss:'（曖昧に微笑んで、視線をそらした）',flat:'（静かに話を聞いている）'};
  const INNER={jirai:'なんだか急かされている気がする。ちょっと怖いかも。',sasaru:'この人は、ちゃんと私を見てくれている気がする。',
    good:'今の話は、少し心に残った。',miss:'悪くはないけど、決め手には欠けるかな。',flat:'まだ、どちらとも言えない。'};
  const REPLIES={
    jirai:['えっと…少し考える時間をいただけますか。','そう言われると、正直ちょっと戸惑ってしまって…','はい…（少し口数が減る）'],
    sasaru:[['そこまで考えてくださるんですね。少し安心しました。','正直、そういう本音の話が一番ありがたいです。'],
            ['その話、すごく刺さりました。前向きに考えたいです。','ここまで向き合ってもらえると思っていませんでした。'],
            ['…正直、気持ちが固まってきました。ありがとうございます。','最後まで私のことを考えてくれて、嬉しいです。']],
    good:[['ありがとうございます。少しずつイメージが湧いてきました。','なるほど、そういう環境なら面白そうですね。'],
          ['その視点は新鮮でした。もう少し聞いてみたいです。','だんだん、御社のことが気になってきました。'],
          ['迷いはありますが、前向きに考えられそうです。','その言葉で、少し背中を押された気がします。']],
    miss:['ありがとうございます。（少し考え込む）','そうですね…もう少し自分でも整理してみます。','なるほど、参考になります。'],
    flat:['はい、承知しました。','ありがとうございます。','そうなんですね。'],
  };
  const pool=(kind==='sasaru'||kind==='good')?REPLIES[kind][si]:REPLIES[kind];
  const reply=pool[msg.length % pool.length];
  const REASON={
    jirai:'圧迫・急かしと受け取られ、警戒された。地雷（'+PERSONA.private.jirai[0]+'）に該当。',
    sasaru:'軸（'+PERSONA.public.axis+'）や本音に寄り添えた。刺さるポイントを突けている。',
    good:'誠実さは伝わった。あと一歩、相手の不安に踏み込めると更に良い。',
    miss:'無難だが個別性が弱く、心を動かすには届かなかった。',
    flat:'可もなく不可もなく。相手の関心にもう少し合わせたい。'};
  // 手抜きが検出されたときは、学生に前向きな反応を返させない
  if(q.flags.length && !hitJirai){
    const cool=['はい…（少し間があいた）','そうですか。ありがとうございます。','はい、承知しました。'];
    return { reply: cool[msg.length%cool.length], togaki:'（画面から少し目を離した）', delta, kind,
      reason: q.flags.join('・')+'。手抜きの対応と受け取られ、気持ちが離れた。',
      inner:'あんまり、ちゃんと見てもらえていない気がするな…。', ng:q.flags.slice(0,3) };
  }
  return { reply, togaki:TOGAKI[kind], delta, kind,
    reason: REASON[kind] + (q.es?'（ESの内容に触れられている）':''),
    inner:INNER[kind], ng: hitJirai?[PERSONA.private.jirai[0]]:[] };
}

function bindInput(){
  const ta=document.getElementById('input'),cnt=document.getElementById('cnt');
  if(!ta)return;

  ta.oninput=()=>{S.input=ta.value;cnt.textContent=ta.value.length;};
  cnt.textContent=ta.value.length;
  ta.focus();
}
function toggleAction(a){
  if(S.busy||S.timedOut)return;
  S.action=S.action===a?'':a;
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.a===S.action));
}
function setTurnHeader(){

      p.className='pip '+(gt<cur?'done':gt===cur?'now':'');});

function updateMood(animate){

  if(!av)return;
  av.textContent=['😨','😕','🧑‍🎓','🙂','😊'][mi];

function setTogaki(txt){const t=document.getElementById('togaki');if(!t)return;
  t.textContent=txt;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}

function startTimer(){
  S.timeLeft=CFG.turnSeconds; S.timedOut=false;
  const el=document.getElementById('timer'); if(!el) return;
  const paint=()=>{
    const mm=Math.floor(S.timeLeft/60), ss=String(S.timeLeft%60).padStart(2,'0');
    el.textContent=`${mm}:${ss}`;
    el.classList.toggle('warn', S.timeLeft<=CFG.warnSeconds && S.timeLeft>15);
    el.classList.toggle('low',  S.timeLeft<=15);
  };
  paint();
  clearInterval(S.timerId);
  S.timerId=setInterval(()=>{
    if(S.timeLeft>0){ S.timeLeft--; paint(); }
    if(S.timeLeft===0){ clearInterval(S.timerId); onTimeUp(); }
  },1000);
}
function onTimeUp(){
  if(S.busy || S.timedOut) return;
  S.timedOut=true;
  const el=document.getElementById('timer');
  if(el){ el.textContent='時間切れ'; el.className='timer low'; }
  const logEl=document.getElementById('log');
  const nt=document.createElement('div');
  nt.className='notice';
  nt.innerHTML=`<span>⏰ 時間切れ${CFG.autoSubmitOnTimeout?'　—　自動で送信します':''}</span>`;
  logEl.appendChild(nt); logEl.scrollTop=logEl.scrollHeight;

  if(!CFG.autoSubmitOnTimeout){ S.timedOut=false; return; }
  const ta=document.getElementById('input');
  if(ta) ta.disabled=true;
  document.getElementById('send').disabled=true;
  const msg=(S.input||'').trim();
  setTimeout(()=>{
    if(msg){ submitTurn(msg, S.action, false); }
    else   { submitTurn('', S.action, true); }
  }, 900);
}

function onSend(){
  if(S.busy)return;
  const msg=(S.input||'').trim();if(!msg)return;
  submitTurn(msg, S.action, false);
}
function submitTurn(msg, action, timedOut){
  clearInterval(S.timerId);
  const logEl=document.getElementById('log');
  const you={type:'you',text: msg||TIMEOUT_MSG, action, timedOut};
  S.log.push(you); logEl.appendChild(logNode(you));
  S.input=''; S.action='';
  const ta=document.getElementById('input'); if(ta){ ta.value=''; }
  const cnt=document.getElementById('cnt'); if(cnt) cnt.textContent='0';
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('on'));
  logEl.scrollTop=logEl.scrollHeight;
  S.pending={msg,action,timedOut};
  runTurn(msg,action,false,timedOut);
}
function retryTurn(){ if(!S.pending)return; clearTmp(); runTurn(S.pending.msg,S.pending.action,false,S.pending.timedOut); }
function continueOffline(){ if(!S.pending)return; clearTmp(); S.offline=true; runTurn(S.pending.msg,S.pending.action,true,S.pending.timedOut); }

async function runTurn(msg,action,forceOffline,timedOut){
  const logEl=document.getElementById('log');
  S.busy=true;
  const sendBtn=document.getElementById('send'); if(sendBtn) sendBtn.disabled=true;
  const tnode=logNode({type:'typing'}); logEl.appendChild(tnode); logEl.scrollTop=logEl.scrollHeight;

  let r=null,err=null;
  if(CFG.useAI && !forceOffline && !S.offline){
    const aiStart = Date.now();
    for(let attempt=0; attempt<MAX_AI_ATTEMPTS && !r; attempt++){
      try{ r=await callStudent(msg,action,timedOut); err=null; }
      catch(e){
        err=e;
        // 再試行しても直らないエラー（入力不正・APIキー不正・安全性ブロックなど）は即座に諦める
        if(e.retryable===false || attempt===MAX_AI_ATTEMPTS-1) break;
        const wait = Math.min(Math.max(e.retryAfterMs||0, 500*Math.pow(2,attempt)), 4000);
        // 次の試行がターン時間を食いつぶすなら、ここで打ち切ってエラー表示に切り替える
        if(Date.now()-aiStart + wait + CFG.timeoutMs > AI_BUDGET_MS) break;
        await sleep(wait);
      }
    }
  } else {
    await sleep(700);
    r=offlineEngine(msg,action,S.stageIdx,timedOut);
  }
  clearTmp();
  if(!r){
    logEl.appendChild(logNode({type:'error',error:err}));
    logEl.scrollTop=logEl.scrollHeight;
    S.busy=false;
    const sb=document.getElementById('send'); if(sb) sb.disabled=false;
    return;
  }
  applyResult(msg,action,r,timedOut);
}

function applyResult(msg,action,r,timedOut){
  const logEl=document.getElementById('log');
  // AIが甘く採点したときの最後の歯止め。手抜き入力にプラスは絶対に出させない。
  // オフラインエンジンは既に同じ上限を適用済みなので、ここを通っても結果は変わらない。
  if(!timedOut){
    const q=analyzeMessage(msg);
    if(q.cap!=null && r.delta>q.cap){
      r={...r, delta:q.cap, kind:(r.kind==='jirai'?'jirai':'miss'),
         reason:q.flags.join('・')+'。'+r.reason,
         ng:(r.ng&&r.ng.length)?r.ng:q.flags.slice(0,3)};
    }
  }
  S.score=Math.max(0,Math.min(100,S.score+r.delta));
  const dir=r.delta>0?'温度が上がった':r.delta<0?'温度が下がった':'温度は横ばい';
  const sm={type:'student',text:r.reply,kind:r.kind,dir};
  S.log.push(sm);logEl.appendChild(logNode(sm));
  setTogaki(r.togaki);updateMood(true);
  logEl.scrollTop=logEl.scrollHeight;
  S.history.push({stageIdx:S.stageIdx,turnIdx:S.turnIdx,
    label:STAGES[S.stageIdx].turns[S.turnIdx].label, message: msg||TIMEOUT_MSG, action, timedOut,
    reply:r.reply,delta:r.delta,reason:r.reason,inner:r.inner,ng:r.ng,
    scoreAfter:S.score,kind:r.kind});
  S.pending=null; S.busy=false; S.timedOut=false;
  const sb=document.getElementById('send'); if(sb) sb.disabled=false;

  if(S.turnIdx < TPS-1){
    S.turnIdx++;
    setTimeout(()=>{
      pushScene(false);
      logEl.appendChild(logNode(S.log[S.log.length-1]));
      setTurnHeader(); startTimer(); bindInput();
      logEl.scrollTop=logEl.scrollHeight;
    },700);
  } else {
    clearInterval(S.timerId);
    setTimeout(()=>{S.screen='report';render();},900);
  }
}

function logNode(m){
  const d=document.createElement('div');
  if(m.type==='scene'){
    d.className='scene-div';const st=m.stage,t=m.turn;
    d.innerHTML=`<span class="line"></span><span class="txt">${m.stageOpen?`Stage ${st.id}　${st.title}｜`:''}${t.label}</span><span class="line"></span>`;
    return d;
  }
  if(m.type==='you'){
    d.className='turn-row you';
    d.innerHTML=`<div class="who">${esc(S.name)}（人事）</div>
      ${m.action&&m.action!=='（発言のみ）'&&!m.timedOut?`<div class="act-chip">🎬 ${esc(m.action)}</div><br>`:''}
      <div class="linecard ${m.timedOut?'to':''}">${esc(m.text)}</div>`;
    return d;
  }
  if(m.type==='typing'){
    d.className='turn-row student';d.dataset.tmp='1';
    d.innerHTML=`<div class="who">${PERSONA.public.name}</div><div class="typing"><i></i><i></i><i></i></div>`;
    return d;
  }
  if(m.type==='error'){
    const e=m.error||{};
    const hopeless = e.retryable===false;
    d.className='errbox';d.dataset.tmp='1';
    d.innerHTML=`⚠️ ${esc(e.message||'AI応答に失敗しました。ネットワークをご確認ください。')}
      ${hopeless?'<div class="det">※ 同じ内容で送り直しても同じ結果になる可能性が高いです。オフラインでの続行をおすすめします。</div>':''}
      <div class="acts">
        <button class="retry press" onclick="retryTurn()">🔄 もう一度送る</button>
        <button class="off press" onclick="continueOffline()">⚡ オフラインで続行</button>
      </div>
      <div class="det">${esc(e.detail||'')}</div>`;
    return d;
  }
  const R=REACT[m.kind]||REACT.flat;
  d.className='turn-row student';
  d.innerHTML=`<div class="who">${PERSONA.public.name}</div>
    <div class="linecard">${esc(m.text)}</div>
    <br><span class="reaction" style="background:${R.bg};color:${R.fg}">${R.icon} ${R.label}<span style="opacity:.7">・${esc(m.dir)}</span></span>`;
  return d;
}

function lineChart(){
  const pts=[{s:PERSONA.initialScore,d:0},...S.history.map(h=>({s:h.scoreAfter,d:h.delta}))];
  const W=560,H=200,padL=8,padR=8,padT=18,padB=24;
  const maxX=Math.max(1,pts.length-1);
  const x=i=>padL+(W-padL-padR)*(i/maxX);
  const y=v=>H-padB-(H-padT-padB)*(v/100);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.s).toFixed(1)}`).join(' ');
  const thY=y(THRESHOLD);
  const bands=STAGES.map((st,i)=>{
    const a=i*TPS,b=(i+1)*TPS;
    if(a>maxX)return '';
    const x1=x(a),x2=x(Math.min(b,maxX));
    return `<rect x="${x1}" y="${padT}" width="${x2-x1}" height="${H-padT-padB}" fill="${i%2?'#f7f9fa':'#fdfdfd'}"/>
      <text x="${(x1+x2)/2}" y="${padT-5}" font-size="10" fill="#aaa" text-anchor="middle" font-weight="700">Stage ${st.id}</text>`;
  }).join('');
  const dots=pts.map((p,i)=>{
    const c=i===0?'#bbb':p.d>0?'#06C755':p.d<0?'#E5484D':'#bbb';
    return `<circle cx="${x(i)}" cy="${y(p.s)}" r="5" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${bands}
    ${[0,25,50,75,100].map(g=>`<line x1="${padL}" x2="${W-padR}" y1="${y(g)}" y2="${y(g)}" stroke="#eee"/>`).join('')}
    <line x1="${padL}" x2="${W-padR}" y1="${thY}" y2="${thY}" stroke="#f5a623" stroke-dasharray="5 4"/>
    <text x="${W-padR-2}" y="${thY-5}" fill="#f5a623" font-size="11" text-anchor="end">承諾ライン ${THRESHOLD}</text>
    <path d="${path}" fill="none" stroke="#06C755" stroke-width="3" stroke-linejoin="round"/>
    ${dots}
    <text x="${x(0)}" y="${H-6}" font-size="10" fill="#999" text-anchor="start">開始</text>
    <text x="${x(maxX)}" y="${H-6}" font-size="10" fill="#999" text-anchor="end">最終</text>
  </svg>`;
}
function confetti(){
  const cols=['#06C755','#ffd700','#ff6b9d','#4dabf7','#ffa94d','#b197fc'];
  let s='<div class="confetti-pieces">';
  for(let i=0;i<70;i++){const l=Math.random()*100,c=cols[i%cols.length],
    d=(2.4+Math.random()*2.4).toFixed(2),dl=(Math.random()*0.9).toFixed(2),
    r=Math.random()>.5?'50%':'2px';
    s+=`<i style="left:${l}%;background:${c};border-radius:${r};animation-duration:${d}s;animation-delay:${dl}s"></i>`;}
  return s+'</div>';
}

function renderRanking(){
  app.innerHTML=`<div class="rank screen"><div class="inner">
    <h2 style="color:#fff;text-align:center;font-weight:900;margin:0 0 2px">🏆 最終ランキング</h2>
    <p style="text-align:center;color:#aaa;font-size:13px;margin:0 0 6px">内定承諾者 → 志望度スコア順</p>
    <div class="count" id="rcount"></div>
    <div id="rankbody"><div class="spin">📡 参加者のスコアを取得中…</div></div>
    <div class="tools">
      <button class="btn-primary press" style="width:auto" onclick="refreshRanking()">🔄 更新</button>
      <button class="btn-ghost press" onclick="reset()">もう一度プレイ</button>
      <button class="btn-ghost press" style="color:#c62828" onclick="wipeRanking()">🗑 記録を全消去（運営用）</button>
    </div>
    <p class="note">※ランキングは参加者全員で共有されています。<br>リハーサルのダミー記録は本番前に「記録を全消去」してください。</p>
  </div></div>`;
  refreshRanking();
}
async function refreshRanking(){
  const box=document.getElementById('rankbody');
  const cnt=document.getElementById('rcount');
  if(!box) return;
  box.innerHTML=`<div class="spin">📡 参加者のスコアを取得中…</div>`;
  if(cnt) cnt.textContent='';
  const rows = await loadScores();

  if(rows===null){
    box.innerHTML=`<div class="spin" style="color:#e6a">⚠️ 共有ランキングを利用できない環境です。自分の結果のみ表示します。</div>`
      + rankRow({name:S.name, score:S.score, ok:S.score>=THRESHOLD}, 0, true);
    return;
  }
  const done = rows.sort((a,b)=>(b.ok-a.ok)||(b.score-a.score));
  if(cnt){
    const okCount = done.filter(r=>r.ok).length;
    cnt.textContent = done.length ? `参加 ${done.length}人　/　内定承諾 ${okCount}人` : '';
  }
  box.innerHTML = done.length
    ? done.map((r,i)=>rankRow(r,i,r.name===S.name)).join('')
    : `<div class="spin">まだ誰も面談を終えていません。</div>`;
}
function rankRow(r,i,isYou){
  const m=MOODS[moodIndex(r.score)], win=i===0;
  const medal = i===0?'👑' : i===1?'🥈' : i===2?'🥉' : (i+1);
  return `<div class="rrow ${isYou?'you':''}" style="animation-delay:${Math.min(i,10)*0.07}s">
    <div class="pos" style="${isYou?'color:#fff':win?'color:#c9a400':''}">${medal}</div>
    <div class="em">${m.em}</div>
    <div class="nm">${esc(r.name)}${isYou?'（あなた）':''}<div style="font-size:11px;font-weight:700;opacity:.8">${m.label}</div></div>
    <div class="sc">${r.score}<div style="font-size:11px;font-weight:800;color:${r.ok?(isYou?'#c8f7d4':'var(--green)'):(isYou?'#ffcdd2':'#c62828')}">${r.ok?'✅ 承諾':'❌ 辞退'}</div></div>
  </div>`;
}
async function wipeRanking(){
  if(!confirm('全参加者のランキング記録を消去します。よろしいですか？')) return;
  await clearScores();
  refreshRanking();
}

function syncDrawer(){
  const dv=document.getElementById('dov'),dr=document.getElementById('drawer');
  if(!dv||!dr)return;
  dv.classList.toggle('open',S.drawer);dr.classList.toggle('open',S.drawer);
}
render();
</script>
</body>
