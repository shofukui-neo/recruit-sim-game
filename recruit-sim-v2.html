<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>採用面談シミュレーション v2</title>
<style>
/* ============================================================
   採用面談シミュレーション v2  — 自己完結・オフライン動作版
   旧実装(React/Vite/API)からの改善版。ビルド不要、単一HTMLで動作。
   ============================================================ */
:root{
  --green:#06C755; --navy:#0b3d2e; --ink:#1f2a30; --sub:#6b7b83;
  --line:#e6eb ee; --bg:#eef1f3; --card:#ffffff;
  --red:#E5484D; --amber:#F5A623; --orange:#F57C00; --lime:#7CB342;
  --paper:#faf8f3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea{font-family:inherit}
#app{min-height:100vh}

/* ---- animations ---- */
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes popBig{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-6deg)}70%{transform:scale(.92) rotate(4deg)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(6,199,85,.35)}100%{box-shadow:0 0 0 18px rgba(6,199,85,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(104vh) rotate(680deg);opacity:.85}}
.screen{animation:fadeIn .35s ease}
.press{transition:transform .12s ease}
.press:active{transform:scale(.95)}
.lift{transition:transform .2s,box-shadow .2s}
.lift:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.10)}

/* ---- generic ---- */
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
.btn-primary{display:block;width:100%;padding:16px;border-radius:16px;color:#fff;font-weight:800;font-size:17px;background:var(--green);box-shadow:0 6px 16px rgba(6,199,85,.35)}
.btn-navy{background:var(--navy);box-shadow:0 6px 16px rgba(11,61,46,.35)}
.btn-ghost{background:#fff;color:#5a6a72;border:1px solid #dfe6ea;font-weight:700;border-radius:16px;padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.muted{color:var(--sub)}
.row{display:flex;gap:8px;padding:6px 0;font-size:14px;line-height:1.5}
.row b{min-width:88px;color:var(--sub);font-weight:800;flex-shrink:0}

/* ============== OPENING ============== */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,#0b3d2e,#06C755,#0b3d2e);background-size:200% 200%;animation:gradientShift 12s ease infinite;position:relative;overflow:hidden}
.hero .inner{max-width:440px;width:100%;text-align:center;position:relative;z-index:2}
.hero h1{color:#fff;font-size:28px;font-weight:900;margin:8px 0;line-height:1.35}
.hero p{color:#eafff2;opacity:.9;font-size:14px;line-height:1.7;margin:0 0 26px}

/* ============== PLAY (面談ルーム) ============== */
.meeting{max-width:680px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.m-head{flex-shrink:0;background:#fff;border-bottom:1px solid #e9edef;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-head .stg{font-weight:900;font-size:14px}
.m-head .stg small{display:block;font-weight:700;color:var(--sub);font-size:11px}
.pips{display:flex;gap:10px;align-items:center}
.pipgroup{display:flex;gap:3px;align-items:center}
.pipgroup .lbl{font-size:9px;color:var(--sub);font-weight:800;margin-right:2px}
.pip{width:9px;height:9px;border-radius:50%;background:#dfe6ea;transition:.4s}
.pip.done{background:var(--green)}
.pip.now{background:var(--amber);animation:breathe 1.4s infinite}
.info-btn{border:1px solid #dfe6ea;background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;color:#3c4a51;display:flex;align-items:center;gap:5px}

/* --- 面談ステージ（表情パネル） --- */
.stage-panel{flex-shrink:0;background:linear-gradient(180deg,#123f31,#0b3d2e);color:#fff;padding:14px 16px 12px;position:relative;overflow:hidden}
.stage-panel .scene{font-size:12px;color:#bfe9d3;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:10px;line-height:1.55;margin-bottom:12px}
.seat{display:flex;align-items:center;gap:14px}
.avatar{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;background:rgba(255,255,255,.12);flex-shrink:0;position:relative;transition:.5s}
.avatar.pulse{animation:ringPulse 1.2s ease}
.seat .who{flex:1;min-width:0}
.seat .who .nm{font-weight:900;font-size:16px}
.seat .who .mood{font-size:13px;font-weight:800;margin-top:2px;transition:.4s}
.tempbar{display:flex;gap:4px;margin-top:8px}
.tempbar .seg{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.tempbar .seg .fill{height:100%;width:0;border-radius:999px;transition:.6s}
.temp-note{font-size:10px;color:#8fc6a9;margin-top:5px;text-align:right}
.togaki{min-height:20px;margin-top:10px;font-size:13px;font-style:italic;color:#cfe9db;transition:.3s;opacity:0}
.togaki.show{opacity:1;animation:slideUp .4s ease}

/* --- 面談録（会話ログ） --- */
.log{flex:1;overflow-y:auto;padding:14px 16px 4px;background:var(--paper);
  background-image:linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px);background-size:100% 30px}
.scene-div{display:flex;align-items:center;gap:10px;margin:14px 0 10px;animation:popIn .4s ease}
.scene-div .line{flex:1;height:1px;background:#e2ddd0}
.scene-div .txt{font-size:11px;font-weight:900;color:#8a7f66;background:#efeadc;padding:3px 12px;border-radius:999px;white-space:nowrap}
.turn-row{margin-bottom:14px}
.turn-row .who{font-size:11px;font-weight:900;margin-bottom:3px;color:var(--sub)}
.turn-row.student .who{color:#0b7a45}
.turn-row.you{text-align:right}
.turn-row.you .who{color:#a06a00}
.linecard{display:inline-block;max-width:82%;padding:10px 14px;font-size:15px;line-height:1.6;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.turn-row.student .linecard{background:#fff;border:1px solid #ece7da;border-left:3px solid #0b7a45;color:#2a3439;animation:slideInLeft .35s ease}
.turn-row.you .linecard{background:#fffdf5;border:1px solid #f0e6c8;border-right:3px solid var(--amber);color:#4a3f24;text-align:left;animation:slideInRight .35s ease}
.act-chip{display:inline-block;margin-bottom:5px;font-size:11px;font-weight:800;background:#fff3cd;color:#8a6d00;padding:3px 9px;border-radius:8px}
.reaction{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:900;padding:4px 11px;border-radius:999px;animation:popIn .4s ease}
.typing{display:inline-flex;gap:4px;padding:12px 16px;background:#fff;border:1px solid #ece7da;border-radius:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block}
.typing i:nth-child(1){animation:typing 1s infinite}
.typing i:nth-child(2){animation:typing 1s .18s infinite}
.typing i:nth-child(3){animation:typing 1s .36s infinite}

/* --- 発言入力 --- */
.composer{flex-shrink:0;background:#fff;border-top:1px solid #e9edef;padding:10px 14px 14px}
.composer .lbl{font-size:11px;font-weight:900;color:var(--sub);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid #dfe6ea;background:#fff;color:#5a6a72;transition:.15s}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 8px rgba(6,199,85,.35)}
.composer .field{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid #dcdfe2;border-radius:14px;padding:10px 12px;font-size:15px;outline:none;line-height:1.5}
.composer textarea:focus{border-color:var(--green)}
.send{width:50px;height:50px;border-radius:50%;flex-shrink:0;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--green);box-shadow:0 4px 14px rgba(6,199,85,.4)}
.send:disabled{background:#ccc;box-shadow:none}
.cnt{text-align:right;font-size:11px;color:#bbb;margin-top:3px}
.timer{font-size:12px;font-weight:900;color:#3c4a51;background:#f0f3f5;border-radius:999px;padding:5px 10px;min-width:52px;text-align:center}
.timer.low{color:#fff;background:var(--red)}

/* --- ドロワー（学生情報 常時確認） --- */
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,88vw);background:#fff;transform:translateX(102%);transition:.28s cubic-bezier(.2,.7,.3,1);z-index:41;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.drawer.open{transform:translateX(0)}
.drawer .dh{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.drawer .dh button{color:#fff;font-size:20px;line-height:1}
.drawer .body{padding:16px}
.sect-t{font-size:12px;font-weight:900;margin:16px 0 6px;color:var(--green)}
.hintbox{background:#fff8e1;color:#8a6d00;font-size:12px;padding:8px 10px;border-radius:10px;line-height:1.6}

/* ============== 中間報告 ============== */
.report{min-height:100vh;padding:24px 16px;background:var(--bg)}
.report .badge{display:inline-block;font-size:12px;font-weight:900;color:#fff;background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:10px}
.trend{display:flex;align-items:center;justify-content:center;gap:14px;font-size:40px;margin:6px 0 4px}
.trend .arrow{font-size:22px;color:var(--sub)}
.rep-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.6}
.rep-item:last-child{border-bottom:none}
.rep-item .ic{font-size:18px;flex-shrink:0}

/* ============== RESULT ============== */
.result{min-height:100vh;padding:24px 16px;background:var(--bg);position:relative;overflow:hidden}
.res-hero{border-radius:20px;padding:26px 22px;text-align:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:18px}
.res-hero.ok{background:linear-gradient(135deg,#0b3d2e,#06C755,#0b3d2e);background-size:200% 200%;animation:gradientShift 8s infinite}
.res-hero.ng{background:linear-gradient(135deg,#5a1a1a,#c62828)}
.res-hero .em{font-size:56px}
.res-hero .quote{background:rgba(0,0,0,.2);border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.7;text-align:left}
svg.chart{width:100%;height:190px;display:block}
.fb-stage{font-size:12px;font-weight:900;color:#fff;background:var(--green);border-radius:8px;padding:3px 10px;display:inline-block;margin:14px 0 8px}
.fb{padding:10px 0;border-bottom:1px solid #f2f2f2}
.fb:last-child{border-bottom:none}
.fb .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fb .tt{font-size:12px;font-weight:800;background:#eef2f5;color:#556;border-radius:6px;padding:2px 8px}
.fb .dl{font-weight:900;font-size:14px}
.fb .said{font-size:13px;margin:3px 0}
.fb .rz{font-size:13px;background:#f6f9fa;border-radius:10px;padding:7px 10px;margin:3px 0}
.fb .in{font-size:13px;font-style:italic;color:#8e44ad}
.fb .ng{font-size:12px;color:#c62828;margin-top:3px}
.confetti-pieces{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti-pieces i{position:absolute;top:-10px;width:8px;height:12px;animation:confettiFall linear forwards}

/* ============== RANKING ============== */
.rank{min-height:100vh;padding:26px 16px;display:flex;align-items:center;
  background:linear-gradient(135deg,#111,#2d2d2d,#111);background-size:200% 200%;animation:gradientShift 14s infinite}
.rank .inner{max-width:640px;margin:0 auto;width:100%}
.rrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:slideInRight .5s ease both}
.rrow.you{background:linear-gradient(90deg,#0b3d2e,#06C755);color:#fff}
.rrow .pos{font-size:22px;font-weight:900;width:34px;text-align:center;color:#999}
.rrow .em{font-size:28px}
.rrow .nm{flex:1;font-weight:900;font-size:16px}
.rrow .sc{text-align:right;font-weight:900;font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   1) 設定データ（旧実装のPERSONA/COMPANYを踏襲・拡張）
   ============================================================ */
const PERSONA = {
  public:{ name:'佐藤 みなと', university:'私立大学 経済学部（文系）', grade:'学部4年',
    industries:'人材 / IT / 広告 など幅広く', axis:'若いうちから成長できる環境・人の役に立つ実感' },
  private:{
    honne:'口では「成長」と言うが、実は安定も気にしている。親から「大手にしなさい」と言われ揺れやすい。詰められる環境は本当は怖い。',
    sasaru:['具体的なキャリアパスの提示','社員のリアルな失敗談・本音','自分の言葉で語る誠実さ','本人の意思決定を尊重する姿勢'],
    jirai:['圧迫感のある詰め・急かし','テンプレ丸出しの対応','返信の放置・遅さ','他社を悪く言う過度な囲い込み','その場しのぎの嘘・話を盛る'],
    personality:'慎重派・共感重視。本音は出しにくいが、信頼すると一気に開く',
    priority:'成長 ＞ 人・社風 ＞ 安定 ＞ 年収 ＞ 勤務地' },
  initialScore:48,
};
const COMPANY = {
  self:{ name:'株式会社ブライトキャリア', business:'人材紹介・採用支援（HR Tech）',
    scale:'従業員300名 / 設立15年 / 成長中のベンチャー', treat:'初任給28万 / 平均残業30h / リモート週2',
    culture:'若手裁量が大きくフラット、スピード感重視', flow:'説明会 → 一次面接 → 最終面接 → 内定' },
  rivals:[
    { name:'メガ・ホールディングス', tag:'大手・安定', desc:'年収高・福利厚生充実だが年功序列で裁量は小さめ。親ウケ◎' },
    { name:'スタートX', tag:'急成長スタートアップ', desc:'裁量最大・成長速いが激務で不安定。ハイリスク' },
  ],
};

/* ★変更点: 5フラットターン → 3ステージ×3ターン(=9) のネスト構造 */
const STAGES = [
  { id:1, title:'出会い・信頼づくり', sub:'序盤 — 関係構築',
    turns:[
      { label:'説明会後の初回接触', scene:'会社説明会の翌日。熱心にメモを取っていた佐藤さんとの初回面談。まだ志望度は高くない。' },
      { label:'就活の軸をヒアリング', scene:'アイスブレイクを終え、就活で大事にしていることを聞き出す場面。本音はまだ出しにくい。' },
      { label:'一次面接への動機づけ', scene:'一次面接を控え、不安と期待が入り混じる佐藤さん。背中を押す場面。' },
    ]},
  { id:2, title:'深耕・動機づけ', sub:'中盤 — 志望度を育てる',
    turns:[
      { label:'一次面接後のフォロー', scene:'一次面接を通過。手応えはあったが、少し不安そうな様子も見せていた。' },
      { label:'社員紹介・オフィス見学', scene:'現場のリアルを見せ、志望度を一段引き上げたい場面。' },
      { label:'「他社から内定」の一報', scene:'「メガ・ホールディングスさんから内定をいただきました。正直迷っています」と打ち明けられた。' },
    ]},
  { id:3, title:'意思決定・クロージング', sub:'終盤 — 決断の後押し',
    turns:[
      { label:'他社比較への向き合い', scene:'最大の山場。大手との間で揺れる気持ちに、正面から向き合う場面。' },
      { label:'最終面接の案内', scene:'進む意思を見せてくれた佐藤さん。最終面接の案内と当日への動機づけ。' },
      { label:'内定承諾のクロージング', scene:'最終面接を通過し、内定を提示。最後の意思決定を後押しするクロージング。' },
    ]},
];
const ACTIONS = ['面談を設定','社員を紹介','オフィス見学','食事に誘う','資料を送付','（発言のみ）'];
const THRESHOLD = 75;

/* ★変更点: 感情段階の const 名を STAGES→MOODS に変更（ステージ構造と衝突回避） */
const MOODS = [
  { em:'😨', label:'引いている',    color:'var(--red)' },
  { em:'😕', label:'警戒気味',      color:'var(--orange)' },
  { em:'😐', label:'ふつう',        color:'var(--amber)' },
  { em:'🙂', label:'前向き',        color:'var(--lime)' },
  { em:'😍', label:'心を開いている', color:'var(--green)' },
];
function moodIndex(s){ return s>=80?4 : s>=65?3 : s>=45?2 : s>=30?1 : 0; }

/* ============================================================
   2) 学生エンジン（内蔵ルールベース・オフライン動作）
   ─ 実LLM(Claude Sonnet 5 / Gemini 3.5 Flash)差し込み口は下部 callStudent 参照
   ============================================================ */
/* reaction種別の見た目・既定文（内蔵エンジンとLLM経路で共用） */
const KIND_META = {
  jirai:{ label:'地雷を踏んだ',   bg:'#fdecea', fg:'#c62828' },
  sasaru:{ label:'刺さった',      bg:'#e7f8ee', fg:'#0b7a45' },
  good:{ label:'手応えあり',      bg:'#eef7f0', fg:'#2e7d32' },
  miss:{ label:'響かなかった',    bg:'#fff4e5', fg:'#a86400' },
  flat:{ label:'ふつう',          bg:'#eef1f3', fg:'#5a6a72' },
};
const DEFAULT_TOGAKI = {
  jirai:'（表情が固くなり、少し身を引いた…）', sasaru:'（目を見て、少し前のめりになった）',
  good:'（小さくうなずいた）', miss:'（曖昧に微笑んで、視線をそらした）', flat:'（静かに話を聞いている）' };
const DEFAULT_INNER = {
  jirai:'なんだか急かされている気がする。ちょっと怖いかも。', sasaru:'この人は、ちゃんと私を見てくれている気がする。',
  good:'今の話は、少し心に残った。', miss:'悪くはないけど、決め手には欠けるかな。', flat:'まだ、どちらとも言えない。' };
function makeReaction(kind, togaki, inner){
  const m = KIND_META[kind] || KIND_META.flat;
  let tg = togaki || DEFAULT_TOGAKI[kind] || DEFAULT_TOGAKI.flat;
  if(tg && !/^[（(]/.test(tg)) tg = '（'+tg.replace(/[）)]$/,'')+'）'; // 括弧が無ければ付与
  return { label:m.label, bg:m.bg, fg:m.fg, togaki:tg,
    inner: inner || DEFAULT_INNER[kind] || DEFAULT_INNER.flat };
}

const SASARU = /キャリア|成長|失敗|正直|本音|あなた|一緒|意思|尊重|不安|迷|悩|寄り添|大丈夫|応援|向き合/;
const JIRAI  = /圧迫|詰め|急|早く|絶対|必ず|他社.*(悪|やめ|微妙|比べ物|やば)|うち以外|嘘|盛|とりあえず来/;

function studentEngine(msg, action, si, ti, score){
  let delta = 1, hitSasaru=false, hitJirai=false;
  if(action==='面談を設定'||action==='社員を紹介'||action==='オフィス見学') delta+=4;
  else if(action==='食事に誘う') delta+=3;
  else if(action==='資料を送付') delta+=2;
  if(SASARU.test(msg)){ delta+=4; hitSasaru=true; }
  if(JIRAI.test(msg)){ delta-=9; hitJirai=true; }
  if(msg.length<12) delta-=2;         // テンプレ・雑な声かけ
  if(msg.length>=40) delta+=1;        // 丁寧さ
  if(si>=2) delta+=1;                 // 終盤は関係性の蓄積
  delta = Math.max(-14, Math.min(14, delta));

  let kind; // reaction種別
  if(hitJirai) kind='jirai';
  else if(delta>=6) kind='sasaru';
  else if(delta>=2) kind='good';
  else if(delta<=-1) kind='miss';
  else kind='flat';

  const RE = makeReaction(kind);

  const REPLIES = {
    jirai:[ 'えっと…少し考える時間をいただけますか。','そう言われると、正直ちょっと戸惑ってしまって…','はい…（少し口数が減る）' ],
    sasaru:{
      0:['そこまで考えてくださるんですね。少し安心しました。','正直、そういう本音の話が一番ありがたいです。'],
      1:['その話、すごく刺さりました。前向きに考えたいです。','ここまで向き合ってもらえると思っていませんでした。'],
      2:['…正直、気持ちが固まってきました。ありがとうございます。','最後まで私のことを考えてくれて、嬉しいです。'],
    },
    good:{
      0:['ありがとうございます。少しずつイメージが湧いてきました。','なるほど、そういう環境なら面白そうですね。'],
      1:['その視点は新鮮でした。もう少し聞いてみたいです。','だんだん、御社のことが気になってきました。'],
      2:['迷いはありますが、前向きに考えられそうです。','その言葉で、少し背中を押された気がします。'],
    },
    miss:['ありがとうございます。（少し考え込む）','そうですね…もう少し自分でも整理してみます。','なるほど、参考になります。'],
    flat:['はい、承知しました。','ありがとうございます。','そうなんですね。'],
  };
  let reply;
  if(kind==='sasaru'||kind==='good'){ const a=REPLIES[kind][si]; reply=a[Math.floor(msg.length)%a.length]; }
  else { const a=REPLIES[kind]; reply=a[Math.floor(msg.length)%a.length]; }

  const reasonMap = {
    jirai:'圧迫・急かしと受け取られ、警戒された。地雷（'+PERSONA.private.jirai[0]+'）に該当。',
    sasaru:'軸（'+PERSONA.public.axis+'）や本音に寄り添えた。刺さるポイントを突けている。',
    good:'誠実さは伝わった。あと一歩、相手の不安に踏み込めると更に良い。',
    miss:'無難だが個別性が弱く、心を動かすには届かなかった。',
    flat:'可もなく不可もなく。相手の関心にもう少し合わせたい。',
  };
  return { reply, delta, kind, reaction:RE, reason:reasonMap[kind],
    ng: hitJirai ? [PERSONA.private.jirai[0]] : [] };
}

/* ============================================================
   実LLM連携（Gemini）。旧 /api/chat の後継。
   - AI.geminiKey を入れると file:// でも直接 Gemini を呼べる（※キー共有に注意）
   - 空なら AI.endpoint（プロキシ api/chat.js）経由で呼ぶ（npm run dev / 本番）
   - どちらも失敗したら内蔵ルールエンジンでオフライン継続
   ============================================================ */
const AI = {
  enabled: true,               // false で常にオフライン体験モード
  model: 'gemini-2.5-flash',   // 最新にするなら 'gemini-3.5-flash'
  geminiKey: '',               // ← ここにAPIキーを入れると直接Geminiを呼ぶ（file://でも動く）
  endpoint: '/api/chat',       // geminiKeyが空のとき使うプロキシ（同一オリジンで配信時）
};

/* Geminiの構造化出力スキーマ（有効なJSONを強制） */
const RESP_SCHEMA = {
  type:'object',
  properties:{
    reply:{type:'string'}, delta:{type:'integer'},
    kind:{type:'string', enum:['sasaru','good','flat','miss','jirai']},
    togaki:{type:'string'}, inner:{type:'string'}, reason:{type:'string'},
    ng:{type:'array', items:{type:'string'}},
  },
  required:['reply','delta','kind','togaki','inner','reason','ng'],
  propertyOrdering:['reply','delta','kind','togaki','inner','reason','ng'],
};

function extractJson(t){ const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s<0||e<0) throw new Error('JSONが見つかりません'); return t.slice(s,e+1); }
function parseLoose(text){
  let t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  t=extractJson(t);
  try{ return JSON.parse(t); }
  catch(e){ return JSON.parse(t.replace(/([,{]\s*)""(\w)/g,'$1"$2')); } // 稀な二重引用符を補修
}
function deriveKind(d){ return d>=6?'sasaru':d>=2?'good':d<=-1?'miss':'flat'; }
function reasonFallback(k){ return {sasaru:'軸や本音に寄り添えた。',good:'誠実さは伝わった。',
  flat:'可もなく不可もなく。',miss:'無難だが心を動かすには届かず。',jirai:'圧迫・急かしと受け取られ警戒された。'}[k]||''; }

function buildPrompt(msg, action){

  const st=STAGES[S.stageIdx], t=st.turns[S.turnIdx];
  const hist=S.log.filter(m=>m.type==='you'||m.type==='student')
    .map(m=>`${m.type==='you'?'人事':'学生'}: ${m.text}`).join('\n')||'（まだ会話なし）';
  return `あなたは新卒採用の面談体験ゲームのAIエンジンです。下記「学生ペルソナ」になりきり、人事担当者（プレイヤー）の発言に1人の就活生として日本語で返答し、同時にその発言が志望度にどう影響したかを評価します。

# 学生ペルソナ
## 公開情報
- 氏名:${p.name} / ${p.university} / ${p.grade}
- 志望業界:${p.industries}
- 就活の軸:${p.axis}
## 非公開の内面（あなただけが知る。口には出さない）
- 本音:${pv.honne}
- 刺さるポイント:${pv.sasaru.join(' / ')}
- 地雷（踏まれると一気に冷める）:${pv.jirai.join(' / ')}
- 性格:${pv.personality}
- 重視条件:${pv.priority}

# 企業
- 自社:${c.self.name} / ${c.self.business} / ${c.self.scale} / ${c.self.treat} / 社風:${c.self.culture}
- 競合:${c.rivals.map(r=>`${r.name}(${r.tag}):${r.desc}`).join(' / ')}

# 現在の面談
- ステージ ${st.id}/3「${st.title}」 ターン ${S.turnIdx+1}/3
- 場面:${t.scene}
- 現在の志望度:${S.score}/100（内部値。会話で数値に触れない）

# これまでの会話
${hist}

# プレイヤーの今回の発言
- 発言:${msg||'（なし）'}
- アクション:${action||'（発言のみ）'}

# タスク
1. 就活生として自然に返答（口語で1〜3文）。刺さる対応には心を開き気味に、地雷を踏まれたら素っ気なく／戸惑い気味に。
2. 志望度の変動(delta)を決める。評価軸:軸との整合／個別性(テンプレ感)／タイミング／NG(圧迫・放置・過度な囲い込み・嘘)。
   素晴らしい:+8〜+14 / 良い:+3〜+7 / 普通:-1〜+2 / 微妙:-7〜-2 / NG:-14〜-8
3. kind を1つ選ぶ: sasaru(刺さった)/good(手応え)/flat(ふつう)/miss(響かず)/jirai(地雷)

# 出力（JSONのみ。前後に文章やコードブロック記法を付けない）
{"reply":"学生の返答","delta":整数,"kind":"sasaru|good|flat|miss|jirai","togaki":"表情や仕草（()付き1文）","inner":"この瞬間の本音（1文）","reason":"スコアが動いた理由（60字程度）","ng":["該当NG行動。無ければ空配列"]}`;
}

async function geminiDirect(prompt){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${AI.model}:generateContent?key=${AI.geminiKey}`;
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({ contents:[{role:'user',parts:[{text:prompt}]}],
      generationConfig:{ temperature:0.4, maxOutputTokens:1024, responseMimeType:'application/json', responseSchema:RESP_SCHEMA, thinkingConfig:{thinkingBudget:0} } })});
  if(!r.ok) throw new Error('gemini '+r.status);
  const d=await r.json();
  return (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
}
async function proxyCall(prompt){
  const r=await fetch(AI.endpoint,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({ model:AI.model, temperature:0.4, max_tokens:1024, json:true, response_schema:RESP_SCHEMA, messages:[{role:'user',content:prompt}] })});
  if(!r.ok) throw new Error('proxy '+r.status);
  const d=await r.json();
  if(d&&d.error) throw new Error(String(d.error));
  return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}

async function callStudent(msg, action){
  if(AI.enabled){
    try{
      const prompt=buildPrompt(msg,action);
      const text = AI.geminiKey ? await geminiDirect(prompt) : await proxyCall(prompt);
      const o=parseLoose(text);
      const delta=Math.max(-14,Math.min(14,Math.round(Number(o.delta)||0)));
      const kind=KIND_META[o.kind]?o.kind:deriveKind(delta);
      return { reply:String(o.reply||'').trim()||'…', delta, kind,
        reaction:makeReaction(kind,o.togaki,o.inner),
        reason:o.reason||reasonFallback(kind), ng:Array.isArray(o.ng)?o.ng:[], source:'gemini' };
    }catch(err){ console.warn('AI応答に失敗 → オフライン体験モードで継続:', err); }
  }
  return Object.assign(studentEngine(msg,action,S.stageIdx,S.turnIdx,S.score),{source:'local'});
}

  const mi=moodIndex(S.score), m=MOODS[mi];
  const av=document.getElementById('avatar'), ml=document.getElementById('moodlabel');
  av.textContent = ['😨','😕','🧑‍🎓','🙂','😊'][mi];
  ml.textContent = m.em+' '+m.label; ml.style.color=m.color;
  if(animate){ av.classList.remove('pulse'); void av.offsetWidth; av.classList.add('pulse'); }
  document.querySelectorAll('#tempbar .seg .fill').forEach((f,i)=>{
    f.style.width = i<=mi?'100%':'0%'; f.style.background=m.color; });
}
function setTogaki(txt){ const t=document.getElementById('togaki'); t.textContent=txt;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
function setAiMode(src){ const b=document.getElementById('aimode'); if(!b) return;
  if(src==='gemini'){ b.textContent='🟢 AI: Gemini接続中'; b.style.background='#e7f8ee'; b.style.color='#0b7a45'; }
  else { b.textContent='⚪ オフライン体験モード'; b.style.background='#eef1f3'; b.style.color='#5a6a72'; } }

function startTimer(){
  S.timeLeft=180;
  const el=document.getElementById('timer');
  const paint=()=>{ const mm=Math.floor(S.timeLeft/60), ss=String(S.timeLeft%60).padStart(2,'0');
    el.textContent=`${mm}:${ss}`; el.classList.toggle('low',S.timeLeft<=20); };
  paint();
  clearInterval(S.timerId);
  S.timerId=setInterval(()=>{ if(S.timeLeft>0){S.timeLeft--;paint();} },1000);
}

/* ログのDOMノード生成 */
function logNode(m){
  const d=document.createElement('div');
  if(m.type==='scene'){
    d.className='scene-div';
    const st=m.stage,t=m.turn;
    d.innerHTML=`<span class="line"></span><span class="txt">${m.stageOpen?`Stage ${st.id}　${st.title}｜`:''}${t.label}</span><span class="line"></span>`;
    return d;
  }
  if(m.type==='you'){
    d.className='turn-row you';
    d.innerHTML=`<div class="who">あなた（人事）</div>
      ${m.action&&m.action!=='（発言のみ）'?`<div class="act-chip">🎬 ${esc(m.action)}</div><br>`:''}
      <div class="linecard">${esc(m.text)}</div>`;
    return d;
  }
  if(m.type==='typing'){
    d.className='turn-row student'; d.dataset.typing='1';
    d.innerHTML=`<div class="who">${PERSONA.public.name}</div><div class="typing"><i></i><i></i><i></i></div>`;
    return d;
  }
  // student
  d.className='turn-row student';
  d.innerHTML=`<div class="who">${PERSONA.public.name}</div>
    <div class="linecard">${esc(m.text)}</div>
    ${m.reaction?`<br><span class="reaction" style="background:${m.reaction.bg};color:${m.reaction.fg}">${reactionIcon(m.kind)} ${m.reaction.label}<span style="opacity:.7">・${m.dir}</span></span>`:''}`;
  return d;
}
function reactionIcon(k){ return {sasaru:'💚',good:'👍',miss:'🌫',flat:'➖',jirai:'⚠️'}[k]||'➖'; }

/* 送信 → 学生応答(AI or 内蔵ルール) → 反応表示 → 次ターン/中間報告 */
async function onSend(){
  if(S.busy) return;
  const msg=(S.input||'').trim(); if(!msg) return;
  const action=S.action;
  const logEl=document.getElementById('log');

  const you={type:'you',text:msg,action};
  S.log.push(you); logEl.appendChild(logNode(you));
  S.input=''; S.action=''; bindInput();
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('on'));
  logEl.scrollTop=logEl.scrollHeight;

  S.busy=true; document.getElementById('send').disabled=true; clearInterval(S.timerId);
  const tnode=logNode({type:'typing'}); logEl.appendChild(tnode); logEl.scrollTop=logEl.scrollHeight;

  // AI応答（最低450msはタイピング演出を見せる）
  let r;
  try{ [r]=await Promise.all([ callStudent(msg,action), new Promise(res=>setTimeout(res,450)) ]); }
  catch(e){ r=Object.assign(studentEngine(msg,action,S.stageIdx,S.turnIdx,S.score),{source:'local'}); }
  tnode.remove();
  setAiMode(r.source);

  S.score=Math.max(0,Math.min(100,S.score+r.delta));
  const dir = r.delta>0?'温度が上がった':r.delta<0?'温度が下がった':'温度は横ばい';
  const sm={type:'student',text:r.reply,reaction:r.reaction,kind:r.kind,dir};
  S.log.push(sm); logEl.appendChild(logNode(sm));
  setTogaki(r.reaction.togaki); updateMood(true); logEl.scrollTop=logEl.scrollHeight;

  S.history.push({ stageIdx:S.stageIdx, turnIdx:S.turnIdx,
    label:STAGES[S.stageIdx].turns[S.turnIdx].label, message:msg, action,
    delta:r.delta, reason:r.reason, inner:r.reaction.inner, ng:r.ng, scoreAfter:S.score, kind:r.kind });

  S.busy=false;
  const sb=document.getElementById('send'); if(sb) sb.disabled=false;

  if(S.turnIdx<2){
    S.turnIdx++;
    setTimeout(()=>{ pushScene(false);
      logEl.appendChild(logNode(S.log[S.log.length-1]));
      setTurnHeader(); startTimer(); bindInput();
      logEl.scrollTop=logEl.scrollHeight; },600);
  } else {
    setTimeout(()=>{ S.screen='report'; render(); },800);
  }
}

/* ---- 中間報告 ---- */
function renderReport(){
  const st=STAGES[S.stageIdx];
  const turns=S.history.filter(h=>h.stageIdx===S.stageIdx);
  const startMi=moodIndex(S.stageStartScore), endMi=moodIndex(S.score);
  const gained=S.score-S.stageStartScore;
  const best=[...turns].sort((a,b)=>b.delta-a.delta)[0];
  const worst=[...turns].sort((a,b)=>a.delta-b.delta)[0];
  const hadNg=turns.some(t=>t.ng&&t.ng.length);
  const isLast = S.stageIdx===2;

  const kokoro = endMi>=3 ? '心を開きはじめ、前向きに検討してくれている。'
    : endMi===2 ? 'まだ様子見。決め手を欲しがっている。'
    : '警戒が残る。信頼の再構築が必要。';

  app.innerHTML=`<div class="report screen"><div class="wrap" style="max-width:560px">
    <div class="badge">中間報告 ${st.id}/3</div>
    <h2 style="font-weight:900;margin:0 0 2px">${st.title}｜総括</h2>
    <p class="muted" style="margin:0 0 14px;font-size:13px">${st.sub}</p>
    <div class="card">
      <div class="muted" style="font-size:12px;font-weight:800;text-align:center">このステージでの温度の推移</div>
      <div class="trend">
        <span>${MOODS[startMi].em}</span><span class="arrow">→</span><span>${MOODS[endMi].em}</span>
      </div>
      <div style="text-align:center;font-weight:900;color:${gained>0?'var(--green)':gained<0?'var(--red)':'var(--sub)'}">
        ${MOODS[startMi].label} → ${MOODS[endMi].label}　${gained>0?'▲ 上昇':gained<0?'▼ 低下':'— 横ばい'}</div>
    </div>
    <div class="card">
      <div class="rep-item"><span class="ic">✅</span><div><b>よかった対応</b><br>
        <span class="muted">「${esc(best.message).slice(0,32)}${best.message.length>32?'…':''}」</span><br>${best.reason}</div></div>
      <div class="rep-item"><span class="ic">🔧</span><div><b>もったいなかった点</b><br>
        <span class="muted">「${esc(worst.message).slice(0,32)}${worst.message.length>32?'…':''}」</span><br>${worst.reason}</div></div>
      <div class="rep-item"><span class="ic">🧠</span><div><b>学生の今の心境（読み）</b><br>${kokoro}${hadNg?'<br><span style="color:#c62828">⚠️ 地雷を踏んだ場面あり。挽回が必要。</span>':''}</div></div>
    </div>
    <button class="btn-primary press" onclick="nextStage()">${isLast?'結果を見る 🎉':'次のステージへ ▶'}</button>
  </div></div>`;
}
function nextStage(){
  if(S.stageIdx>=2){ S.screen='result'; render(); return; }
  S.stageIdx++; S.turnIdx=0; S.stageStartScore=S.score;
  pushScene(true);
  S.screen='play'; render();
}

/* ---- RESULT ---- */
function renderResult(){
  const final=S.score, ok=final>=THRESHOLD;
  const pts=[{n:'開始',s:PERSONA.initialScore}, ...S.history.map((h,i)=>({n:'T'+(i+1),s:h.scoreAfter}))];
  app.innerHTML=`<div class="result screen">
    ${ok?confetti():''}
    <div class="wrap" style="max-width:620px;position:relative;z-index:6">
      <div class="res-hero ${ok?'ok':'ng'}">
        <div class="em">${ok?'🎉':'💔'}</div>
        <div style="font-size:24px;font-weight:900;margin-top:4px">${ok?'内定承諾！':'辞退…'}</div>
        <div class="quote">「${ok
          ?'正直たくさん迷いましたが、最後まで私のことを一番考えてくれたのはブライトキャリアさんでした。お世話になります！'
          :'色々ありがとうございました。悩んだ末、別の会社に決めました。ごめんなさい。'}」</div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <div style="font-weight:900;font-size:14px;color:#555">志望度スコアの推移（ここで初公開）</div>
          <div style="font-size:30px;font-weight:900;color:${ok?'var(--green)':'#c62828'}">${final}<span style="font-size:13px">/100</span></div>
        </div>
        ${lineChart(pts)}
      </div>
      <div class="card">
        <div style="font-weight:900;font-size:14px;color:#555;margin-bottom:2px">ステージ別フィードバック</div>
        ${STAGES.map(st=>{
          const hs=S.history.filter(h=>h.stageIdx===st.id-1);
          return `<div class="fb-stage">Stage ${st.id}｜${st.title}</div>`+hs.map(h=>`
            <div class="fb">
              <div class="top"><span class="tt">${h.label}</span>
                <span class="dl" style="color:${h.delta>0?'var(--green)':h.delta<0?'var(--red)':'var(--sub)'}">${h.delta>0?'+':''}${h.delta}</span></div>
              <div class="said"><span class="muted">あなた：</span>${esc(h.message)}${h.action&&h.action!=='（発言のみ）'?`（${esc(h.action)}）`:''}</div>
              <div class="rz">💡 ${h.reason}</div>
              <div class="in">🗨 本音：${esc(h.inner)}</div>
              ${h.ng&&h.ng.length?`<div class="ng">⚠️ NG行動：${h.ng.map(esc).join(' / ')}</div>`:''}
            </div>`).join('');
        }).join('')}
      </div>
      <div style="display:flex;gap:12px">
        <button class="btn-primary press" style="flex:1" onclick="S.screen='ranking';render()">全体ランキングへ 🏆</button>
        <button class="btn-ghost press" onclick="reset()">やり直す</button>
      </div>
    </div>
  </div>`;
}
function lineChart(pts){
  const W=560,H=190,pad=28, maxX=pts.length-1;
  const x=i=>pad+(W-pad*2)*(i/maxX), y=v=>H-20-(H-40)*(v/100);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.s).toFixed(1)}`).join(' ');
  const thY=y(THRESHOLD);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${[0,25,50,75,100].map(g=>`<line x1="${pad}" x2="${W-pad}" y1="${y(g)}" y2="${y(g)}" stroke="#eee"/>`).join('')}
    <line x1="${pad}" x2="${W-pad}" y1="${thY}" y2="${thY}" stroke="#f5a623" stroke-dasharray="5 4"/>
    <text x="${W-pad}" y="${thY-5}" fill="#f5a623" font-size="11" text-anchor="end">承諾ライン ${THRESHOLD}</text>
    <path d="${path}" fill="none" stroke="#06C755" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.s)}" r="4" fill="#06C755"/>
      <text x="${x(i)}" y="${H-4}" font-size="10" fill="#999" text-anchor="middle">${p.n}</text>`).join('')}
  </svg>`;
}
function confetti(){
  const cols=['#06C755','#ffd700','#ff6b9d','#4dabf7','#ffa94d','#b197fc'];
  let s='<div class="confetti-pieces">';
  for(let i=0;i<70;i++){ const l=Math.random()*100,c=cols[i%cols.length],
    d=(2.4+Math.random()*2.4).toFixed(2),dl=(Math.random()*0.9).toFixed(2),
    r=Math.random()>.5?'50%':'2px';
    s+=`<i style="left:${l}%;background:${c};border-radius:${r};animation-duration:${d}s;animation-delay:${dl}s"></i>`; }
  return s+'</div>';
}

/* ---- RANKING ---- */
function renderRanking(){
  const final=S.score, you={name:'チームA（あなた）',score:final,ok:final>=THRESHOLD,you:true};
  const others=[{name:'チームB',score:71,ok:false},{name:'チームC',score:86,ok:true},{name:'チームD',score:52,ok:false}];
  const all=[...others,you].sort((a,b)=>(b.ok-a.ok)||(b.score-a.score));
  app.innerHTML=`<div class="rank screen"><div class="inner">
    <h2 style="color:#fff;text-align:center;font-weight:900;margin:0 0 2px">🏆 最終ランキング</h2>
    <p style="text-align:center;color:#aaa;font-size:13px;margin:0 0 20px">内定承諾チーム → 志望度スコア順</p>
    ${all.map((t,i)=>{const m=MOODS[moodIndex(t.score)];const win=i===0;
      return `<div class="rrow ${t.you?'you':''}" style="animation-delay:${i*0.1}s">
        <div class="pos" style="${t.you?'color:#fff':win?'color:#c9a400':''}">${win?'👑':i+1}</div>
        <div class="em">${m.em}</div>
        <div class="nm">${t.name}<div style="font-size:11px;font-weight:700;opacity:.8">${m.label}</div></div>
        <div class="sc">${t.score}<div style="font-size:11px;font-weight:800;color:${t.ok?(t.you?'#c8f7d4':'var(--green)'):(t.you?'#ffcdd2':'#c62828')}">${t.ok?'✅ 承諾':'❌ 辞退'}</div></div>
      </div>`;}).join('')}
    <div style="text-align:center;margin-top:22px">
      <button class="btn-primary press" style="display:inline-block;width:auto;padding:12px 30px" onclick="reset()">もう一度プレイ</button>
      <p style="color:#888;font-size:11px;margin-top:12px">※他チームはデモ用のサンプルスコアです</p>
    </div>
  </div></div>`;
}

/* ---- ドロワー同期 ---- */
function syncDrawer(){
  const dv=document.getElementById('dov'), dr=document.getElementById('drawer');
  if(!dv||!dr) return;
  dv.classList.toggle('open',S.drawer); dr.classList.toggle('open',S.drawer);
}

/* start */
render();
</script>
